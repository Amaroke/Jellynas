services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.1
    container_name: seerr
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    labels:
      kuma.seerr.http.name: Seerr
      kuma.seerr.http.url: http://seerr:5055/api/v1/settings/public
      kuma.seerr-public.http.name: Seerr public
      kuma.seerr-public.http.url: https://seerr.${DOMAIN}:${CADDY_HTTPS_PORT:-443}/api/v1/settings/public
      kuma.seerr-public.http.expiry_notification: "true"
    volumes:
      - ${APPDATA_ROOT}/seerr:/app/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:5055/api/v1/settings/public"]
      timeout: 10s
      start_period: 30s
