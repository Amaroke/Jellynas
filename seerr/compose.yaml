services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.1
    container_name: seerr
    init: true
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    volumes:
      - ${APPDATA_ROOT}/seerr:/app/config
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:5055/api/v1/settings/public"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
