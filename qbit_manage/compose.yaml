services:
  qbit_manage:
    image: ghcr.io/stuffanthings/qbit_manage:v4.14.0
    container_name: qbit_manage
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      QBITTORRENT_USER: ${QBITTORRENT_USER}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
      QBT_WEB_SERVER: "true"
      QBT_PORT: 8181
      QBT_RUN: "false"
      QBT_SCHEDULE: 10
      QBT_CONFIG_DIR: /config
      QBT_LOGFILE: qbit_manage.log
    volumes:
      - ${APPDATA_ROOT}/qbit_manage:/config
      - ${DATA_ROOT}/torrents:/data/torrents
    ports:
      - ${QBIT_MANAGE_PORT:-8181}:8181
