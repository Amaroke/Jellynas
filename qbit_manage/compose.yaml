services:
  qbit_manage:
    image: ghcr.io/stuffanthings/qbit_manage:v4.15.0
    container_name: qbit_manage
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      QBITTORRENT_USER: ${QBITTORRENT_USER}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
      QBT_WEB_SERVER: "true"
      QBT_SCHEDULE: 10
      QBT_CONFIG_DIR: /config
    volumes:
      - ${APPDATA_ROOT}/qbit_manage:/config
      - ${DATA_ROOT}/torrents:/data/torrents
