commands:
  tag_update: true
  tag_tracker_error: true
  skip_qb_version_check: true

qbt:
  host: gluetun:8080
  user: !ENV QBITTORRENT_USER
  pass: !ENV QBITTORRENT_PASSWORD

settings:
  private_tag: private
  cat_update_all: false
  disable_qbt_default_share_limits: false

directory:
  root_dir: /data/torrents

cat:
  movies: /data/torrents/movies
  shows: /data/torrents/shows
  music: /data/torrents/music
  books: /data/torrents/books
  farm: /data/torrents/farm

tracker:
  other:
    tag: other

recyclebin:
  enabled: false
