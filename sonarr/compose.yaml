services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329
    container_name: sonarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      kuma.sonarr.http.name: Sonarr
      kuma.sonarr.http.url: http://sonarr:8989/ping
    volumes:
      - ${APPDATA_ROOT}/sonarr:/config
      - ${DATA_ROOT}/media/shows:/data/media/shows
      - ${DATA_ROOT}/media/anime:/data/media/anime
      - ${DATA_ROOT}/torrents:/data/torrents
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8989/ping"]
      timeout: 10s
      start_period: 30s
