services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls371
    container_name: bazarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      TDARR_API_KEY: ${TDARR_API_KEY}
    volumes:
      - ${APPDATA_ROOT}/bazarr:/config
      - ${DATA_ROOT}/media/movies:/data/media/movies
      - ${DATA_ROOT}/media/shows:/data/media/shows
      - ${DATA_ROOT}/media/anime:/data/media/anime
      - ./tdarr_requeue.py:/scripts/tdarr_requeue.py:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:6767/api/system/ping"]
      timeout: 10s
      start_period: 30s
