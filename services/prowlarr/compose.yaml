---
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls167
    container_name: prowlarr
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      kuma.prowlarr.http.name: Prowlarr
      kuma.prowlarr.http.url: http://prowlarr:9696/ping
      docker-volume-backup.stop-during-backup: "true"
    volumes:
      - ${APPDATA_ROOT}/prowlarr:/config
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "--output"
        - "/dev/null"
        - "http://localhost:9696/ping"
      timeout: 10s
      start_period: 30s
