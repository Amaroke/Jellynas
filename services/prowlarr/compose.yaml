---
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:3.1.0.5799-ls170
    container_name: prowlarr
    restart: unless-stopped
    depends_on:
      flaresolverr:
        condition: service_healthy
        required: false
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      kuma.prowlarr.http.name: Prowlarr
      kuma.prowlarr.http.url: http://prowlarr:9696/ping
      docker-volume-backup.stop-during-backup: "true"
      dashboard.name: Prowlarr
      dashboard.section: Automation
      dashboard.description: Indexers
      dashboard.widget: prowlarr
      dashboard.icon: prowlarr.svg
      dashboard.href: https://prowlarr.lan.${DOMAIN}:${CADDY_HTTPS_PORT:-443}
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    volumes:
      - ${APPDATA_ROOT}/prowlarr:/config
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "--output"
        - "/dev/null"
        - "http://localhost:9696/ping"
      timeout: 10s
      start_period: 30s
