---
services:
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:3.06.00
    container_name: tdarr
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      internalNode: "true"
      nodeName: InternalNode
      auth: "true"
      seededApiKey: ${TDARR_API_KEY}
      apiKey: ${TDARR_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
      transcodecpuWorkers: 1
      healthcheckcpuWorkers: 1
    labels:
      kuma.tdarr.http.name: Tdarr
      kuma.tdarr.http.url: http://tdarr:8265/api/v2/status
      docker-volume-backup.stop-during-backup: "true"
    volumes:
      - ${APPDATA_ROOT}/tdarr/server:/app/server
      - ${APPDATA_ROOT}/tdarr/configs:/app/configs
      - ${APPDATA_ROOT}/tdarr/logs:/app/logs
      - ${APPDATA_ROOT}/tdarr/cache:/temp
      - ${DATA_ROOT}/media/movies:/data/media/movies
      - ${DATA_ROOT}/media/shows:/data/media/shows
      - ${DATA_ROOT}/media/anime:/data/media/anime
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "--output"
        - "/dev/null"
        - "http://localhost:8265/api/v2/status"
      timeout: 10s
      start_period: 60s
