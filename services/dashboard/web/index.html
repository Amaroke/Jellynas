<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Dashboard</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
<link rel="stylesheet" href="/assets/sections.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; max-width: 1400px; margin: 0 auto; }
header h1 { font-size: 18px; margin: 0; font-weight: 600; }
#live { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
#live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--unhealthy); }
#live.on::before { background: var(--running); }
main { padding: 0 16px 32px; max-width: 1400px; margin: 0 auto; display: grid; gap: 24px; }
section h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); display: flex; align-items: center; gap: 8px; }
section h2::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--accent); }
.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); } }
.card { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); display: grid; gap: 10px; min-width: 0; align-content: start; }
.card .head { display: flex; align-items: center; gap: 12px; min-width: 0; }
.card .description { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 6px; }
.figure { background: var(--bg); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.figure b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.figure span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.rows li { display: grid; gap: 2px; font-size: 12px; min-width: 0; }
.rows .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows .detail { color: var(--muted); }
.rows meter { width: 100%; height: 4px; }
.rows li.art { grid-template-columns: 36px minmax(0, 1fr); column-gap: 8px; }
.rows li.art img, .rows li.art .cover { grid-row: span 3; width: 36px; height: 54px; object-fit: cover; border-radius: 4px; background: var(--bg); }
.rows li.art meter { grid-column: 2; }
.rows li.art meter.blank { visibility: hidden; }
.rows li.idle .title, .rows li.idle .cover { color: var(--muted); }
.rows li.idle .cover { display: grid; place-items: center; font-size: 16px; }
.posters { display: grid; grid-auto-flow: column; grid-auto-columns: 72px; gap: 8px; overflow-x: auto; margin: 0; padding: 0 0 4px; list-style: none; }
.posters li { display: grid; gap: 2px; font-size: 11px; min-width: 0; }
.posters img { width: 72px; height: 108px; object-fit: cover; border-radius: 6px; background: var(--bg); }
.posters .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.posters .detail { color: var(--muted); }
.note { font-size: 12px; color: var(--restarting); }
.note.failed { color: var(--unhealthy); }
.alert { background: color-mix(in srgb, var(--unhealthy) 14%, var(--card)); border: 1px solid var(--unhealthy); border-radius: var(--radius); padding: 10px 14px; display: grid; gap: 4px; }
.alert b { color: var(--unhealthy); }
.alert ul { margin: 0; padding-left: 18px; }
.usage { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.spark { display: grid; gap: 2px; font-size: 11px; color: var(--muted); min-width: 0; }
.spark b { color: var(--text); font-weight: 600; }
.spark svg, .throughput svg { width: 100%; height: 28px; display: block; overflow: visible; }
.spark polyline, .throughput polyline { fill: none; stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.throughput { display: grid; gap: 4px; font-size: 11px; color: var(--muted); }
.throughput svg { height: 70px; border-bottom: 1px solid var(--line); }
.throughput .keys { display: flex; flex-wrap: wrap; gap: 2px 12px; white-space: nowrap; }
.throughput .keys span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: currentColor; }
#status { display: grid; gap: 12px; }
#status .clock { font-size: 22px; font-weight: 600; }
#status .date { color: var(--muted); }
#status .figures { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
#status .figure { background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 10px 12px; }
#status .figure b { font-size: 18px; }
.card .link { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; flex: 1; min-width: 0; }
.card a.link:hover .name { text-decoration: underline; }
.card .link img, .card .letter { width: 32px; height: 32px; flex: none; border-radius: 8px; }
.card .letter { display: grid; place-items: center; background: var(--accent); color: var(--card); font-weight: 700; }
.card .text { display: grid; min-width: 0; }
.card .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .state { font-size: 12px; color: var(--state); display: flex; align-items: center; gap: 6px; }
.card .state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--state); }
.card[data-state="running"] { --state: var(--running); }
.card[data-state="stopped"] { --state: var(--stopped); }
.card[data-state="unhealthy"] { --state: var(--unhealthy); }
.card[data-state="restarting"] { --state: var(--restarting); }
.card .error { color: var(--unhealthy); font-size: 12px; }
.controls { display: flex; align-items: center; gap: 8px; flex: none; }
.controls button { font: inherit; font-size: 12px; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.controls button:disabled { opacity: 0.4; cursor: default; }
.switch { position: relative; width: 40px; height: 24px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 12px; background: var(--line); transition: background 0.15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); transition: transform 0.15s; }
.switch input:checked + span { background: var(--running); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Dashboard</h1>
  <span id="live">offline</span>
</header>
<main></main>
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<script src="/assets/sections.js"></script>
<script id="sections" type="application/json">{{ sections|tojson }}</script>
<script id="services" type="application/json">{{ services|tojson }}</script>
<script id="board" type="application/json">{{ board|tojson }}</script>
<script>
const sections = JSON.parse(document.getElementById("sections").textContent);
const main = document.querySelector("main");
const errors = new Map();

function element(tag, attributes = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
  node.append(...children);
  return node;
}

async function control(service, action) {
  errors.delete(service.service);
  const response = await fetch(`/services/${encodeURIComponent(service.service)}/${action}`, {
    method: "POST",
    headers: { "X-Dashboard": "1" },
  }).catch(() => null);
  if (!response || !response.ok) {
    errors.set(service.service, `Cannot ${action === "restart" ? "restart" : `turn ${action}`} ${service.name}`);
  }
  render(current);
}

function clock(seconds) {
  return new Date(seconds * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
}

function bytes(value) {
  const units = ["B", "KiB", "MiB", "GiB", "TiB"];
  let unit = 0;
  while (Math.abs(value) >= 1024 && unit < units.length - 1) {
    value /= 1024;
    unit += 1;
  }
  return `${value.toFixed(unit ? 1 : 0)} ${units[unit]}`;
}

function line(points, top, color) {
  const shape = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  const step = points.length > 1 ? 100 / (points.length - 1) : 0;
  shape.setAttribute("points", points.map((value, index) => `${(index * step).toFixed(2)},${(100 - 95 * value / top).toFixed(2)}`).join(" "));
  shape.style.stroke = color;
  return shape;
}

function plot(series) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 100 100");
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("aria-hidden", "true");
  const top = Math.max(1, ...series.flatMap(([points]) => points));
  for (const [points, color] of series) if (points.length) svg.append(line(points, top, color));
  return svg;
}

function usage(name) {
  const series = (board.history || {})[name] || {};
  const nodes = [];
  if (series.download || series.upload) {
    const down = series.download || [];
    const up = series.upload || [];
    nodes.push(element("div", { class: "throughput" },
      element("div", { class: "keys" },
        element("span", { style: "color: var(--downloads)" }, `Down ${bytes(down.at(-1) || 0)}/s`),
        element("span", { style: "color: var(--watch)" }, `Up ${bytes(up.at(-1) || 0)}/s`),
        element("span", {}, `peak ${bytes(Math.max(0, ...down, ...up))}/s`)),
      plot([[down, "var(--downloads)"], [up, "var(--watch)"]])));
  }
  const sparks = [];
  if (series.cpu && series.cpu.length) {
    sparks.push(element("div", { class: "spark" }, element("span", {}, "CPU ", element("b", {}, `${series.cpu.at(-1).toFixed(1)}%`)), plot([[series.cpu, "var(--accent)"]])));
  }
  if (series.memory && series.memory.length) {
    sparks.push(element("div", { class: "spark" }, element("span", {}, "RAM ", element("b", {}, bytes(series.memory.at(-1)))), plot([[series.memory, "var(--accent)"]])));
  }
  if (sparks.length) nodes.push(element("div", { class: "usage" }, ...sparks));
  return nodes;
}

function alerts(services) {
  const troubled = services.filter(service => !service.shutdown && (service.state === "unhealthy" || service.state === "restarting"));
  if (!troubled.length) return [];
  return [element("div", { class: "alert", role: "alert" },
    element("b", {}, troubled.length === 1 ? "1 service needs attention" : `${troubled.length} services need attention`),
    element("ul", {}, ...troubled.map(service => element("li", {}, `${service.name} is ${service.state}`))))];
}

function picture(src) {
  const image = element("img", { src, alt: "", loading: "lazy", referrerpolicy: "no-referrer" });
  image.addEventListener("error", () => { image.style.visibility = "hidden"; });
  return image;
}

function panel(found) {
  if (!found) return [];
  const nodes = [];
  const reading = found.reading;
  if (reading && reading.figures.length) {
    nodes.push(element("div", { class: "figures" }, ...reading.figures.map(figure =>
      element("div", { class: "figure" }, element("b", {}, figure.value), element("span", {}, figure.label)))));
  }
  if (reading && reading.rows.length) {
    nodes.push(element("ul", { class: "rows" }, ...reading.rows.map(row => {
      const item = element("li", {}, element("span", { class: "title" }, row.title), element("span", { class: "detail" }, row.detail));
      if (row.image) {
        item.classList.add("art");
        item.prepend(picture(row.image));
      }
      if (row.progress !== null) item.append(element("meter", { min: "0", max: "1", value: String(row.progress) }));
      else if (row.image) item.append(element("meter", { class: "blank", min: "0", max: "1", value: "0" }));
      return item;
    })));
  } else if (reading && reading.idle) {
    nodes.push(element("ul", { class: "rows" }, element("li", { class: "art idle" },
      element("span", { class: "cover", "aria-hidden": "true" }, "♪"),
      element("span", { class: "title" }, reading.idle),
      element("span", { class: "detail" }, "—"),
      element("meter", { class: "blank", min: "0", max: "1", value: "0" }))));
  }
  if (reading && reading.posters && reading.posters.length) {
    nodes.push(element("ul", { class: "posters", "aria-label": "Latest additions" }, ...reading.posters.map(poster =>
      element("li", { title: `${poster.title} · ${poster.detail}` }, picture(poster.image),
        element("span", { class: "title" }, poster.title), element("span", { class: "detail" }, poster.detail)))));
  }
  if (found.error) {
    nodes.push(reading
      ? element("span", { class: "note" }, `Stale since ${clock(found.updated)}: ${found.error}`)
      : element("span", { class: "note failed" }, `No data: ${found.error}`));
  }
  return nodes;
}

function status() {
  return element("section", { id: "status", style: "--accent: var(--status)" },
    element("h2", {}, "Status"),
    element("div", {}, element("div", { class: "clock" }), element("div", { class: "date" })),
    ...panel(board.host));
}

function tick() {
  const now = new Date();
  for (const node of document.querySelectorAll("#status .clock")) {
    node.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  }
  for (const node of document.querySelectorAll("#status .date")) {
    node.textContent = now.toLocaleDateString([], { dateStyle: "full" });
  }
}

function refresh() {
  for (const node of main.querySelectorAll("article.card")) {
    node.replaceChildren(node.querySelector(".head"), ...panel(board.widgets[node.dataset.service]), ...usage(node.dataset.service));
  }
  const host = document.getElementById("status");
  if (host) host.replaceChildren(...[...host.children].slice(0, 2), ...panel(board.host));
  for (const block of main.querySelectorAll(".native")) {
    const typing = document.activeElement && document.activeElement.tagName === "INPUT" && block.contains(document.activeElement);
    if (typing) continue;
    const fresh = native(block.parentElement.dataset.slug);
    if (!fresh) continue;
    unmount(block);
    block.replaceWith(fresh);
    mount(fresh);
  }
}

function letter(service) {
  return element("span", { class: "letter" }, service.name.charAt(0).toUpperCase());
}

function card(service) {
  let icon = letter(service);
  if (service.icon) {
    icon = element("img", { src: `/icons/${service.icon}`, alt: "", loading: "lazy" });
    icon.onerror = () => icon.replaceWith(letter(service));
  }
  const text = element("span", { class: "text" }, element("span", { class: "name" }, service.name));
  if (service.description) text.append(element("span", { class: "description" }, service.description));
  text.append(element("span", { class: "state" }, service.shutdown ? "shut down" : service.state));
  if (errors.has(service.service)) text.append(element("span", { class: "error" }, errors.get(service.service)));
  const link = service.href
    ? element("a", { class: "link", href: service.href }, icon, text)
    : element("span", { class: "link" }, icon, text);
  const head = element("div", { class: "head" }, link);
  const node = element("article", { class: "card", "data-state": service.state, "data-service": service.service }, head, ...panel(board.widgets[service.service]), ...usage(service.service));
  if (service.switchable) {
    const toggle = element("input", { type: "checkbox", role: "switch", "aria-label": `${service.name} on` });
    toggle.checked = !service.shutdown;
    toggle.onchange = () => {
      if (!toggle.checked && !confirm(`Shut down ${service.name}? It stays off through deploys and reboots.`)) {
        toggle.checked = true;
        return;
      }
      toggle.disabled = true;
      control(service, toggle.checked ? "on" : "off");
    };
    const restart = element("button", { type: "button" }, "Restart");
    restart.disabled = service.shutdown;
    restart.onclick = () => {
      if (!confirm(`Restart ${service.name}?`)) return;
      restart.disabled = true;
      control(service, "restart");
    };
    head.append(element("span", { class: "controls" }, restart, element("label", { class: "switch" }, toggle, element("span"))));
  }
  return node;
}

let current = JSON.parse(document.getElementById("services").textContent);
let board = JSON.parse(document.getElementById("board").textContent);

function render(services) {
  current = services;
  for (const block of main.querySelectorAll(".native")) unmount(block);
  main.replaceChildren(...alerts(services), ...sections.flatMap(section => {
    if (section.slug === "status") return [status()];
    const cards = services.filter(service => service.section === section.slug).map(card);
    const extra = native(section.slug);
    if (!cards.length && !extra) return [];
    const node = element("section", { style: `--accent: var(--${section.slug})`, "data-slug": section.slug }, element("h2", {}, section.title));
    if (extra) node.append(extra);
    if (cards.length) node.append(element("div", { class: "grid" }, ...cards));
    return [node];
  }));
  tick();
  for (const block of main.querySelectorAll(".native")) mount(block);
}

render(current);
setInterval(tick, 1000);
const live = document.getElementById("live");
function follow() {
  const stream = new EventSource("/events");
  stream.addEventListener("services", event => render(JSON.parse(event.data)));
  stream.addEventListener("board", event => {
    board = JSON.parse(event.data);
    refresh();
  });
  stream.onopen = () => { live.className = "on"; live.textContent = "live"; };
  stream.onerror = () => {
    live.className = "";
    live.textContent = "offline";
    if (stream.readyState === EventSource.CLOSED) setTimeout(follow, 5000);
  };
}

follow();
</script>
</body>
</html>
