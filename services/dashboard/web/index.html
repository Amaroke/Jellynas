<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Dashboard</title>
<link rel="manifest" href="/assets/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-small.png">
<link rel="apple-touch-icon" href="/assets/icon-apple.png">
<meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="preload" href="/assets/plex-sans-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
<link rel="stylesheet" href="/assets/sections.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(18px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) 8px calc(24px + env(safe-area-inset-left)); max-width: 1680px; margin: 0 auto; }
header h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
#live { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
#live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--unhealthy); }
#live.on::before { background: var(--running); }
main { padding: 0 calc(24px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left)); max-width: 1680px; margin: 0 auto; display: grid; gap: 24px; }
@media (max-width: 600px) { header { padding: calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 6px calc(16px + env(safe-area-inset-left)); } main { padding: 0 calc(16px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); } }
section h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
section h2::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
section.folded > .native { display: none; }

.alert { background: color-mix(in srgb, var(--unhealthy) 14%, var(--card)); border: 1px solid var(--unhealthy); border-radius: var(--radius); padding: 10px 14px; display: grid; gap: 4px; }
.alert b { color: var(--unhealthy); }
.alert ul { margin: 0; padding-left: 18px; }

#status { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
#status .now { display: grid; align-content: center; padding-right: 8px; }
#status .clock { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
#status .date { color: var(--muted); font-size: 12px; }
#status .figure { background: var(--card); border: 1px solid var(--line); padding: 10px 12px; }
#status .figure b { font-size: 18px; }
#status .note { grid-column: 1 / -1; }

.room { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; align-items: start; }
@media (max-width: 1100px) { .room { grid-template-columns: minmax(0, 1fr); } }

.table { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.table h3 { position: sticky; top: env(safe-area-inset-top); z-index: 1; margin: 0; padding: 10px 16px; font-size: 13px; font-weight: 600; background: var(--raised); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.table .group:first-child h3 { border-top: none; border-radius: var(--radius) var(--radius) 0 0; }
.table h3::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
.table h3 small { color: var(--muted); font-weight: 400; font-size: 12px; }
.table h3 small.look { color: var(--unhealthy); }
.service { border-top: 1px solid var(--line); }
.service .line { display: grid; grid-template-columns: 8px 24px minmax(150px, 1.1fr) minmax(0, 2fr) 92px 92px 132px 92px; align-items: center; gap: 12px; padding: 8px 16px; font-size: 13px; }
.service[data-state="running"] { --state: var(--running); }
.service[data-state="stopped"] { --state: var(--stopped); }
.service[data-state="unhealthy"] { --state: var(--unhealthy); }
.service[data-state="restarting"] { --state: var(--restarting); }
.service .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--state); }
.service .icon, .service .letter { width: 24px; height: 24px; border-radius: 5px; }
.service .letter { display: grid; place-items: center; background: var(--raised); color: var(--muted); font-size: 12px; font-weight: 600; }
.service .who { display: grid; min-width: 0; }
.service .who a, .service .who .name { color: inherit; text-decoration: none; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.service .who a:hover { text-decoration: underline; }
.service .who small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.service .facts { display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--muted); min-width: 0; }
.service .facts b { color: var(--text); font-weight: 600; margin-left: 4px; }
.service .facts .stale { color: var(--restarting); }
.service .facts .failed { color: var(--unhealthy); }
.service .meter { display: grid; gap: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
.service .meter b { color: var(--text); font-weight: 500; }
[data-level="0"] { --level: var(--running); }
[data-level="1"] { --level: color-mix(in srgb, var(--running) 50%, var(--restarting)); }
[data-level="2"] { --level: var(--restarting); }
[data-level="3"] { --level: color-mix(in srgb, var(--restarting) 50%, var(--unhealthy)); }
[data-level="4"] { --level: var(--unhealthy); }
.service .meter[data-level] b, .service .up b[data-level] { color: var(--level); }
.service .meter svg { width: 100%; height: 18px; display: block; overflow: visible; }
.service .up { font-size: 12px; color: var(--muted); display: grid; }
.service .up b { color: var(--text); font-weight: 500; }
.service .acts { display: flex; gap: 2px; justify-content: flex-end; }
.service .error { grid-column: 3 / -1; color: var(--unhealthy); font-size: 12px; }
.icon-button { width: 28px; height: 28px; display: grid; place-items: center; padding: 0; font: inherit; font-size: 15px; line-height: 1; color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 6px; cursor: pointer; }
.icon-button:hover:not(:disabled) { color: var(--text); background: var(--raised); border-color: var(--line); }
.icon-button:disabled { opacity: 0.35; cursor: default; }
.icon-button.power.on { color: var(--running); }
.icon-button.more { font-size: 18px; }
.icon-button.more[aria-expanded="true"] { transform: rotate(180deg); }
.service .more-area { padding: 2px 16px 14px 60px; display: grid; gap: 10px; }
.service .more-area > .rows { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); column-gap: 24px; }
@media (max-width: 900px) {
  .service .line { grid-template-columns: 8px 24px minmax(0, 1fr) auto; }
  .service .meter, .service .up { display: none; }
  .service .facts { grid-column: 3 / -1; order: 1; }
  .service .facts > span:not(.stale):not(.failed):not(.off) { display: none; }
  .service .facts:not(:has(.stale, .failed, .off)) { display: none; }
  .service .more-area { padding-left: 16px; }
}

.rail { display: grid; gap: 14px; position: sticky; top: calc(12px + env(safe-area-inset-top)); }
@media (max-width: 1100px) { .rail { position: static; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; } }
.block { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.block h4 { margin: 0; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.block h4 a { color: inherit; text-decoration: none; }
.block h4 a:hover { text-decoration: underline; }
.block h4 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--state); }
.block[data-state="running"] { --state: var(--running); }
.block[data-state="stopped"] { --state: var(--stopped); }
.block[data-state="unhealthy"] { --state: var(--unhealthy); }
.block[data-state="restarting"] { --state: var(--restarting); }

.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 6px; }
.figure { background: var(--raised); border-radius: 6px; padding: 7px 9px; min-width: 0; }
.figure b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.figure span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.rows li { display: grid; gap: 2px; font-size: 13px; min-width: 0; }
.rows .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows .detail { color: var(--muted); font-size: 12px; }
.rows meter { width: 100%; height: 4px; appearance: none; border: none; border-radius: 2px; background: var(--line); }
.rows meter::-webkit-meter-bar { height: 4px; border: none; border-radius: 2px; background: var(--line); }
.rows meter::-webkit-meter-optimum-value { border-radius: 2px; background: var(--accent, var(--focus)); }
.rows meter::-moz-meter-bar { border-radius: 2px; background: var(--accent, var(--focus)); }
.rows li.art { grid-template-columns: 36px minmax(0, 1fr); column-gap: 10px; }
.rows li.art img, .rows li.art .cover { grid-row: span 3; width: 36px; height: 54px; object-fit: cover; border-radius: 4px; background: var(--raised); }
.rows li.art meter { grid-column: 2; }
.rows meter.blank { visibility: hidden; }
.rows li.idle .title, .rows li.idle .cover { color: var(--muted); }
.rows li.idle .cover { display: grid; place-items: center; font-size: 16px; }
.posters { display: grid; grid-auto-flow: column; grid-auto-columns: 72px; gap: 8px; overflow-x: auto; margin: 0; padding: 0 0 4px; list-style: none; }
.posters li { display: grid; gap: 2px; font-size: 12px; min-width: 0; }
.posters img, .posters .cover { width: 72px; height: 108px; object-fit: cover; border-radius: 6px; background: var(--raised); }
.posters .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.posters .detail { color: var(--muted); }
.posters .idle .title { color: var(--muted); }
.shelf { display: grid; gap: 6px; min-width: 0; }
.caption { font-size: 12px; font-weight: 500; color: var(--muted); }
.note { font-size: 12px; color: var(--restarting); }
.note.failed { color: var(--unhealthy); }
.answer { display: flex; gap: 6px; grid-column: 2; margin-top: 2px; }
.answer button { font: inherit; font-size: 12px; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 2px 9px; cursor: pointer; }
.answer button.approve { border-color: color-mix(in srgb, var(--running) 60%, var(--line)); color: var(--running); }
.answer button:disabled { opacity: 0.5; cursor: default; }
.answer .failed { color: var(--unhealthy); font-size: 12px; }
.throughput { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.throughput svg { width: 100%; height: 70px; display: block; overflow: visible; border-bottom: 1px solid var(--line); }
.throughput .keys { display: flex; flex-wrap: wrap; gap: 2px 12px; white-space: nowrap; }
.throughput .keys span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: currentColor; }
.links { display: grid; gap: 0; }
.links .caption { margin: 8px 0 2px; }
.links .caption:first-child { margin-top: 0; }
.link { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; min-width: 0; }
.links .caption + .link { border-top: none; }
.link .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--running); }
.link[data-state="off"] .dot, .link[data-state="unknown"] .dot { background: var(--stopped); }
.link[data-state="paused"] .dot { background: var(--restarting); }
.link[data-state="failing"] .dot { background: var(--unhealthy); }
.link .what { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.link .what small { color: var(--muted); font-size: 12px; margin-left: 6px; }
.link .says { font-size: 12px; color: var(--muted); white-space: nowrap; }
.link .switches { display: flex; gap: 2px; justify-content: flex-end; min-width: 50px; }
.link .icon-button { width: 24px; height: 24px; font-size: 13px; }
.link .failed { grid-column: 2 / -1; color: var(--unhealthy); font-size: 12px; }
.link[data-state="paused"] .says { color: var(--restarting); }
.link[data-state="failing"] .says { color: var(--unhealthy); }
.said { margin: 0; font-size: 12px; padding: 6px 8px; border-radius: 6px; color: var(--restarting); background: color-mix(in srgb, var(--restarting) 12%, transparent); }
.said.error { color: var(--unhealthy); background: color-mix(in srgb, var(--unhealthy) 12%, transparent); }
.service .facts .off { color: var(--restarting); }
svg polyline { fill: none; stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
</style>
</head>
<body>
<header>
  <h1>Dashboard</h1>
  <span id="live">offline</span>
</header>
<main></main>
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<script src="/assets/sections.js"></script>
<script id="sections" type="application/json">{{ sections|tojson }}</script>
<script id="services" type="application/json">{{ services|tojson }}</script>
<script id="board" type="application/json">{{ board|tojson }}</script>
<script>
const sections = JSON.parse(document.getElementById("sections").textContent);
const main = document.querySelector("main");
const errors = new Map();
const answers = new Map();
const switching = new Map();
const opened = new Set();
const folded = new Set(["pull-requests"]);
const busy = new Set();
const missing = new Set();
const RAIL = [["jellyfin", "Jellyfin"], ["music-bot", "Music bot"], ["seerr", "Requests"], ["qbittorrent", "Downloads"]];
const LINKED = new Set(["aurral", "prowlarr", "radarr", "sonarr"]);
const KINDS = [["worker", "Worker"], ["indexer", "Indexers"], ["proxy", "Proxies"], ["client", "Download clients"]];
const NATIVE = new Set(["pull-requests", "farm"]);
const ARTWORK = new Set(["jellyfin", "music-bot"]);

function element(tag, attributes = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
  node.append(...children);
  return node;
}

async function control(service, action) {
  errors.delete(service.service);
  busy.add(service.service);
  refresh();
  const response = await fetch(`/services/${encodeURIComponent(service.service)}/${action}`, {
    method: "POST",
    headers: { "X-Dashboard": "1" },
  }).catch(() => null);
  if (!response || !response.ok) {
    errors.set(service.service, `Cannot ${action === "restart" ? "restart" : `turn ${action}`} ${service.name}`);
  }
  busy.delete(service.service);
  render(current);
}

async function answer(id, action) {
  answers.set(id, "pending");
  refresh();
  const response = await fetch(`/seerr/requests/${id}/${action}`, { method: "POST", headers: { "X-Dashboard": "1" } }).catch(() => null);
  if (response && response.ok) answers.delete(id);
  else answers.set(id, `Cannot ${action} this request`);
  refresh();
}

function buttons(id) {
  const state = answers.get(id);
  const approve = element("button", { type: "button", class: "approve", "data-focus": `${id} approve` }, "Approve");
  const decline = element("button", { type: "button", "data-focus": `${id} decline` }, "Decline");
  approve.disabled = decline.disabled = state === "pending";
  approve.addEventListener("click", () => answer(id, "approve"));
  decline.addEventListener("click", () => answer(id, "decline"));
  const node = element("div", { class: "answer" }, approve, decline);
  if (state && state !== "pending") node.append(element("span", { class: "failed" }, state));
  return node;
}

function clock(seconds) {
  return new Date(seconds * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
}

function bytes(value) {
  const units = ["B", "KiB", "MiB", "GiB", "TiB"];
  let unit = 0;
  while (Math.abs(value) >= 1024 && unit < units.length - 1) {
    value /= 1024;
    unit += 1;
  }
  return `${value.toFixed(unit ? 1 : 0)} ${units[unit]}`;
}

function line(points, top, stroke) {
  const shape = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  const step = points.length > 1 ? 100 / (points.length - 1) : 0;
  shape.setAttribute("points", points.map((value, index) => `${(index * step).toFixed(2)},${(100 - 95 * value / top).toFixed(2)}`).join(" "));
  shape.style.stroke = stroke;
  return shape;
}

function plot(series) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 100 100");
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("aria-hidden", "true");
  const top = Math.max(1, ...series.flatMap(([points]) => points));
  for (const [points, stroke] of series) if (points.length) svg.append(line(points, top, stroke));
  if (!svg.childElementCount) svg.append(line([0, 0], 1, "var(--line)"));
  return svg;
}

function history(name) {
  return (board.history || {})[name] || {};
}

function throughput(name) {
  const series = history(name);
  const down = series.download || [];
  const up = series.upload || [];
  return element("div", { class: "throughput" },
    element("div", { class: "keys" },
      element("span", { style: "color: var(--downloads)" }, `Down ${bytes(down.at(-1) || 0)}/s`),
      element("span", { style: "color: var(--watch)" }, `Up ${bytes(up.at(-1) || 0)}/s`),
      element("span", {}, `peak ${bytes(Math.max(0, ...down, ...up))}/s`)),
    plot([[down, "var(--downloads)"], [up, "var(--watch)"]]));
}

function alerts(services) {
  const troubled = services.filter(service => !service.shutdown && (service.state === "unhealthy" || service.state === "restarting"));
  if (!troubled.length) return [];
  return [element("div", { class: "alert", role: "alert" },
    element("b", {}, troubled.length === 1 ? "1 service needs attention" : `${troubled.length} services need attention`),
    element("ul", {}, ...troubled.map(service => element("li", {}, `${service.name} is ${service.state}`))))];
}

function picture(src) {
  const image = element("img", { src, alt: "", loading: "lazy", referrerpolicy: "no-referrer" });
  image.addEventListener("error", () => { image.style.visibility = "hidden"; });
  return image;
}

function figures(reading) {
  return element("div", { class: "figures" }, ...reading.figures.map(figure =>
    element("div", { class: "figure" }, element("b", {}, figure.value), element("span", {}, figure.label))));
}

function trouble(found) {
  if (!found || !found.error) return [];
  return [found.reading && found.updated
    ? element("span", { class: "note" }, `Stale since ${clock(found.updated)}: ${found.error}`)
    : element("span", { class: "note failed" }, `No data: ${found.error}`)];
}

function details(found, kind) {
  if (!found) return [];
  const nodes = [];
  const reading = found.reading;
  if (reading && reading.rows.length) {
    nodes.push(element("ul", { class: "rows" }, ...reading.rows.map(row => {
      const item = element("li", {}, element("span", { class: "title" }, row.title), element("span", { class: "detail" }, row.detail));
      if (row.image) {
        item.classList.add("art");
        item.prepend(picture(row.image));
      }
      if (row.progress !== null) item.append(element("meter", { min: "0", max: "1", value: String(row.progress) }));
      else if (row.image && !(kind === "seerr" && row.id)) item.append(element("meter", { class: "blank", min: "0", max: "1", value: "0" }));
      if (kind === "seerr" && row.id) {
        if (!row.image) {
          item.classList.add("art");
          item.prepend(element("span", { class: "cover", "aria-hidden": "true" }));
        }
        item.append(buttons(row.id));
      }
      return item;
    })));
  } else if (reading && reading.idle) {
    const item = element("li", { class: "idle" },
      element("span", { class: "title" }, reading.idle),
      element("span", { class: "detail" }, "—"),
      element("meter", { class: "blank", min: "0", max: "1", value: "0" }));
    if (ARTWORK.has(kind) || kind === "seerr") {
      item.classList.add("art");
      item.prepend(element("span", { class: "cover", "aria-hidden": "true" }, kind === "seerr" ? "" : "♪"));
    }
    nodes.push(element("ul", { class: "rows" }, item));
  }
  if (reading && reading.shelf) {
    const cover = () => element("span", { class: "cover", "aria-hidden": "true" });
    const tiles = reading.posters.length
      ? reading.posters.map(poster =>
        element("li", { title: `${poster.title}, ${poster.detail}` }, poster.image ? picture(poster.image) : cover(),
          element("span", { class: "title" }, poster.title), element("span", { class: "detail" }, poster.detail)))
      : [1, 2, 3].map(() => element("li", { class: "idle" }, cover(),
        element("span", { class: "title" }, found.updated ? "Nothing yet" : "—"), element("span", { class: "detail" }, "—")));
    nodes.push(element("div", { class: "shelf" }, element("span", { class: "caption" }, reading.shelf),
      element("ul", { class: "posters", "aria-label": reading.shelf }, ...tiles)));
  }
  return nodes;
}

function panel(found, kind) {
  if (!found) return [];
  const reading = found.reading;
  return [...(reading && reading.figures.length ? [figures(reading)] : []), ...details(found, kind), ...trouble(found)];
}

function icon(service) {
  const letter = () => element("span", { class: "letter", "aria-hidden": "true" }, service.name.charAt(0).toUpperCase());
  if (!service.icon || missing.has(service.icon)) return letter();
  const image = element("img", { class: "icon", src: `/icons/${service.icon}`, alt: "", loading: "lazy" });
  image.onerror = () => {
    missing.add(service.icon);
    image.replaceWith(letter());
  };
  return image;
}

function stateOf(service) {
  return service.shutdown ? "stopped" : service.state;
}

function linksOf(service) {
  const found = board.widgets[service.service];
  const reading = found && found.reading;
  return { links: (reading && reading.links) || [], health: (reading && reading.health) || [] };
}

function looks(service) {
  const found = board.widgets[service.service];
  const broken = found && found.error ? 1 : 0;
  const { links, health } = linksOf(service);
  const failing = links.filter(link => link.state === "failing").length;
  const connections = broken ? 0 : health.length || failing;
  return broken + connections + (service.shutdown || service.state === "running" ? 0 : 1) + (errors.has(service.service) ? 1 : 0);
}

async function switchLink(service, link, action) {
  const key = `${service.service} ${link.kind} ${link.id}`;
  switching.set(key, "pending");
  refresh();
  const response = await fetch(`/connections/${encodeURIComponent(service.service)}/${link.kind}/${link.id}/${action}`, { method: "POST", headers: { "X-Dashboard": "1" } }).catch(() => null);
  if (response && response.ok) switching.delete(key);
  else {
    const said = `Cannot ${action === "retry" ? "retry" : `turn ${action}`} ${link.name}`;
    switching.set(key, said);
    setTimeout(() => {
      if (switching.get(key) !== said) return;
      switching.delete(key);
      refresh();
    }, 15000);
  }
  refresh();
}

function switches(service, link) {
  const key = `${service.service} ${link.kind} ${link.id}`;
  const pending = switching.get(key) === "pending";
  const node = element("span", { class: "switches" });
  if (link.state === "failing") {
    const retry = element("button", { type: "button", class: "icon-button", "data-focus": `${key} retry`, "aria-label": `Retry ${link.name}`, title: `Retry ${link.name}` }, "↻");
    retry.disabled = pending;
    retry.onclick = () => switchLink(service, link, "retry");
    node.append(retry);
  }
  if (link.kind !== "proxy" && link.hint !== "from Prowlarr" && ["on", "off", "failing"].includes(link.state)) {
    const on = link.state !== "off";
    const power = element("button", { type: "button", class: `icon-button power ${on ? "on" : ""}`, "data-focus": `${key} power`, role: "switch", "aria-checked": String(on), "aria-label": `${link.name} on`, title: on ? `Turn off ${link.name}` : `Turn on ${link.name}` }, "⏻");
    power.disabled = pending;
    power.onclick = () => {
      if (on && !confirm(`Turn off ${link.name} in ${service.name}?`)) return;
      switchLink(service, link, on ? "off" : "on");
    };
    node.append(power);
  }
  return node;
}

function says(link) {
  if (link.state === "failing") {
    if (link.kind === "proxy") return "Unavailable";
    if (!link.until) return "Failing";
    const until = new Date(link.until * 1000);
    const today = until.toDateString() === new Date().toDateString();
    return `Failing until ${today ? "" : `${until.toLocaleDateString([], { weekday: "short" })} `}${clock(link.until)}`;
  }
  if (link.kind === "worker" && link.state === "off") return "Paused";
  return { on: "On", off: "Off", paused: "Paused by ratio", unknown: "\u2014" }[link.state] || link.state;
}

function connections(service) {
  const { links, health } = linksOf(service);
  const node = element("div", { class: "links" });
  for (const [kind, title] of KINDS) {
    const own = links.filter(link => link.kind === kind);
    if (!own.length) continue;
    node.append(element("span", { class: "caption" }, title), ...own.map(link => {
      const row = element("div", { class: "link", "data-state": link.state },
        element("span", { class: "dot", "aria-hidden": "true" }),
        element("span", { class: "what" }, link.name, link.hint ? element("small", {}, link.hint) : ""),
        element("span", { class: "says" }, says(link)),
        switches(service, link));
      const failed = switching.get(`${service.service} ${link.kind} ${link.id}`);
      if (failed && failed !== "pending") row.append(element("span", { class: "failed" }, failed));
      return row;
    }));
  }
  if (!links.length) node.append(element("span", { class: "caption" }, "Nothing read yet"));
  return [node, ...health.map(item => element("p", { class: `said ${item.level === "error" ? "error" : ""}` }, item.message))];
}

function facts(service) {
  const found = board.widgets[service.service];
  const node = element("span", { class: "facts" });
  const reading = found && found.reading;
  if (reading) for (const figure of reading.figures) node.append(element("span", {}, figure.label, element("b", {}, figure.value)));
  for (const link of linksOf(service).links) {
    if (link.state === "off" || link.state === "failing") node.append(element("span", { class: link.state === "failing" ? "failed" : "off" }, `${link.name} ${says(link).toLowerCase()}`));
  }
  if (found && found.error) {
    node.append(reading && found.updated
      ? element("span", { class: "stale" }, `Stale since ${clock(found.updated)}`)
      : element("span", { class: "failed" }, `No data: ${found.error}`));
  }
  return node;
}

const CPU_STEPS = [10, 35, 75, 150];
const RAM_STEPS = [256, 512, 1024, 2048].map(mebibytes => mebibytes * 1048576);
const UPTIME_STEPS = [99.9, 99, 97, 90];

function level(value, steps, falling) {
  const index = steps.findIndex(step => falling ? value >= step : value < step);
  return String(index === -1 ? steps.length : index);
}

function meter(label, points, shown, steps) {
  if (!points.length) return element("span", { class: "meter" }, element("span", {}, `${label} `, element("b", {}, "—")), plot([[points, "var(--accent)"]]));
  const last = points.at(-1);
  return element("span", { class: "meter", "data-level": level(last, steps) }, element("span", {}, `${label} `, element("b", {}, shown(last))), plot([[points, "var(--level)"]]));
}

function uptime(name) {
  const found = (board.uptime || {})[name] || {};
  const node = element("span", { class: "up" });
  for (const [label, value] of [["24h", found.day], ["7d", found.week]]) {
    if (value === null || value === undefined) continue;
    node.append(element("span", {}, `${label} `, element("b", { "data-level": level(value, UPTIME_STEPS, true) }, `${value.toFixed(2)}%`)));
  }
  return node;
}

function expandable(service) {
  if (RAIL.some(([name]) => name === service.service)) return false;
  const found = board.widgets[service.service];
  const reading = found && found.reading;
  return Boolean(reading && (reading.rows.length || reading.shelf));
}

function actions(service) {
  const node = element("span", { class: "acts" });
  if (expandable(service)) {
    const more = element("button", { type: "button", class: "icon-button more", "data-focus": `${service.service} more`, "aria-expanded": String(opened.has(service.service)), "aria-label": `Details of ${service.name}`, title: "Details" }, "▾");
    more.onclick = () => {
      if (opened.has(service.service)) opened.delete(service.service);
      else opened.add(service.service);
      refresh();
    };
    node.append(more);
  }
  if (!service.switchable) return node;
  const restart = element("button", { type: "button", class: "icon-button", "data-focus": `${service.service} restart`, "aria-label": `Restart ${service.name}`, title: `Restart ${service.name}` }, "↻");
  restart.disabled = service.shutdown || busy.has(service.service);
  restart.onclick = () => {
    if (!confirm(`Restart ${service.name}?`)) return;
    restart.disabled = true;
    control(service, "restart");
  };
  const power = element("button", { type: "button", class: `icon-button power ${service.shutdown ? "" : "on"}`, "data-focus": `${service.service} power`, role: "switch", "aria-checked": String(!service.shutdown), "aria-label": `${service.name} on`, title: service.shutdown ? `Turn on ${service.name}` : `Shut down ${service.name}` }, "⏻");
  power.disabled = busy.has(service.service);
  power.onclick = () => {
    if (!service.shutdown && !confirm(`Shut down ${service.name}? It stays off through deploys and reboots.`)) return;
    power.disabled = true;
    control(service, service.shutdown ? "on" : "off");
  };
  node.append(restart, power);
  return node;
}

function row(service) {
  const series = history(service.service);
  const name = service.href
    ? element("a", { href: service.href, "data-focus": `${service.service} link` }, service.name)
    : element("span", { class: "name" }, service.name);
  const state = stateOf(service);
  const said = service.shutdown ? "shut down" : state === "running" ? service.description || state : service.description ? `${state}, ${service.description}` : state;
  const who = element("span", { class: "who" }, name, element("small", {}, said));
  const line = element("div", { class: "line" },
    element("span", { class: "dot", title: stateOf(service) }), icon(service), who, facts(service),
    meter("CPU", series.cpu || [], value => `${value.toFixed(1)}%`, CPU_STEPS),
    meter("RAM", series.memory || [], bytes, RAM_STEPS),
    uptime(service.name),
    actions(service));
  if (errors.has(service.service)) line.append(element("span", { class: "error" }, errors.get(service.service)));
  const node = element("div", { class: "service", "data-state": stateOf(service), "data-service": service.service }, line);
  if (opened.has(service.service) && expandable(service)) {
    node.append(element("div", { class: "more-area" }, ...details(board.widgets[service.service], service.widget)));
  }
  return node;
}

function table(services) {
  const node = element("div", { class: "table" });
  for (const section of sections) {
    const own = services.filter(service => service.section === section.slug);
    if (!own.length) continue;
    const count = own.reduce((sum, service) => sum + looks(service), 0);
    const summary = element("small", { class: count ? "look" : "" }, count ? `${own.length}, ${count} to look at` : String(own.length));
    node.append(element("div", { class: "group", style: `--accent: var(--${section.slug})` },
      element("h3", {}, section.title, summary), ...own.map(row)));
  }
  return node;
}

function block(title, service, nodes) {
  const heading = service.href ? element("a", { href: service.href, "data-focus": `${service.service} rail` }, title) : element("span", {}, title);
  return element("article", { class: "block", "data-state": stateOf(service), style: `--accent: var(--${service.section})` },
    element("h4", {}, element("span", { class: "dot" }), heading), ...nodes);
}

function rail(services) {
  const node = element("aside", { class: "rail" });
  for (const [name, title] of RAIL) {
    const service = services.find(item => item.service === name);
    if (!service) continue;
    const nodes = panel(board.widgets[name], service.widget);
    if (name === "qbittorrent") nodes.push(throughput(name));
    node.append(block(title, service, nodes));
  }
  for (const service of services.filter(item => LINKED.has(item.widget))) {
    node.append(block(service.name, service, [...connections(service), ...trouble(board.widgets[service.service])]));
  }
  return node;
}

function status() {
  const host = board.host || {};
  return element("section", { id: "status", "aria-label": "Status" },
    element("div", { class: "now" }, element("span", { class: "clock" }), element("span", { class: "date" })),
    ...(host.reading ? host.reading.figures.map(figure => element("div", { class: "figure" }, element("b", {}, figure.value), element("span", {}, figure.label))) : []),
    ...trouble(host));
}

function natives() {
  return sections.filter(section => NATIVE.has(section.slug)).flatMap(section => {
    const extra = native(section.slug);
    if (!extra) return [];
    const node = element("section", { style: `--accent: var(--${section.slug})`, "data-slug": section.slug, class: folded.has(section.slug) ? "folded" : "" });
    const fold = element("button", { type: "button", class: "icon-button more", "aria-expanded": String(!folded.has(section.slug)), "aria-label": `Fold ${section.title}`, title: "Fold" }, "▾");
    fold.onclick = () => {
      if (folded.has(section.slug)) folded.delete(section.slug);
      else folded.add(section.slug);
      node.classList.toggle("folded", folded.has(section.slug));
      fold.setAttribute("aria-expanded", String(!folded.has(section.slug)));
    };
    node.append(element("h2", {}, section.title, fold), extra);
    return [node];
  });
}

function tick() {
  const now = new Date();
  for (const node of document.querySelectorAll("#status .clock")) {
    node.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  }
  for (const node of document.querySelectorAll("#status .date")) {
    node.textContent = now.toLocaleDateString([], { dateStyle: "full" });
  }
}

function refresh() {
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.focus : null;
  document.getElementById("status")?.replaceWith(status());
  main.querySelector(".table")?.replaceWith(table(current));
  main.querySelector(".rail")?.replaceWith(rail(current));
  if (focused) {
    const again = [...main.querySelectorAll("[data-focus]")].find(node => node.dataset.focus === focused);
    if (again) again.focus();
  }
  tick();
  for (const block of main.querySelectorAll(".native")) {
    const typing = document.activeElement && document.activeElement.tagName === "INPUT" && block.contains(document.activeElement);
    if (typing) continue;
    const fresh = native(block.parentElement.dataset.slug);
    if (!fresh) continue;
    unmount(block);
    block.replaceWith(fresh);
    mount(fresh);
  }
}

let current = JSON.parse(document.getElementById("services").textContent);
let board = JSON.parse(document.getElementById("board").textContent);

function render(services) {
  current = services;
  for (const block of main.querySelectorAll(".native")) unmount(block);
  main.replaceChildren(...alerts(services), status(), element("div", { class: "room" }, table(services), rail(services)), ...natives());
  tick();
  for (const block of main.querySelectorAll(".native")) mount(block);
}

render(current);
setInterval(tick, 1000);
const live = document.getElementById("live");
function follow() {
  const stream = new EventSource("/events");
  stream.addEventListener("services", event => render(JSON.parse(event.data)));
  stream.addEventListener("board", event => {
    board = JSON.parse(event.data);
    refresh();
  });
  stream.onopen = () => { live.className = "on"; live.textContent = "live"; };
  stream.onerror = () => {
    live.className = "";
    live.textContent = "offline";
    if (stream.readyState === EventSource.CLOSED) setTimeout(follow, 5000);
  };
}

follow();
</script>
</body>
</html>
