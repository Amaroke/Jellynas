<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Dashboard</title>
<link rel="stylesheet" href="/theme.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; max-width: 1400px; margin: 0 auto; }
header h1 { font-size: 18px; margin: 0; font-weight: 600; }
#live { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
#live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--unhealthy); }
#live.on::before { background: var(--running); }
main { padding: 0 16px 32px; max-width: 1400px; margin: 0 auto; display: grid; gap: 24px; }
section h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); display: flex; align-items: center; gap: 8px; }
section h2::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--accent); }
.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); } }
.card { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; min-width: 0; }
.card .link { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; flex: 1; min-width: 0; }
.card a.link:hover .name { text-decoration: underline; }
.card img, .card .letter { width: 32px; height: 32px; flex: none; border-radius: 8px; }
.card .letter { display: grid; place-items: center; background: var(--accent); color: var(--card); font-weight: 700; }
.card .text { display: grid; min-width: 0; }
.card .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .state { font-size: 12px; color: var(--state); display: flex; align-items: center; gap: 6px; }
.card .state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--state); }
.card[data-state="running"] { --state: var(--running); }
.card[data-state="stopped"] { --state: var(--stopped); }
.card[data-state="unhealthy"] { --state: var(--unhealthy); }
.card[data-state="restarting"] { --state: var(--restarting); }
.card .error { color: var(--unhealthy); font-size: 12px; }
.controls { display: flex; align-items: center; gap: 8px; flex: none; }
.controls button { font: inherit; font-size: 12px; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.controls button:disabled { opacity: 0.4; cursor: default; }
.switch { position: relative; width: 40px; height: 24px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 12px; background: var(--line); transition: background 0.15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); transition: transform 0.15s; }
.switch input:checked + span { background: var(--running); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Dashboard</h1>
  <span id="live">offline</span>
</header>
<main></main>
<script id="sections" type="application/json">{{ sections|tojson }}</script>
<script id="services" type="application/json">{{ services|tojson }}</script>
<script>
const sections = JSON.parse(document.getElementById("sections").textContent);
const main = document.querySelector("main");
const errors = new Map();

function element(tag, attributes = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
  node.append(...children);
  return node;
}

async function control(service, action) {
  errors.delete(service.service);
  const response = await fetch(`/services/${encodeURIComponent(service.service)}/${action}`, {
    method: "POST",
    headers: { "X-Dashboard": "1" },
  }).catch(() => null);
  if (!response || !response.ok) {
    errors.set(service.service, `Cannot ${action === "restart" ? "restart" : `turn ${action}`} ${service.name}`);
  }
  render(current);
}

function letter(service) {
  return element("span", { class: "letter" }, service.name.charAt(0).toUpperCase());
}

function card(service) {
  let icon = letter(service);
  if (service.icon) {
    icon = element("img", { src: `/icons/${service.icon}`, alt: "", loading: "lazy" });
    icon.onerror = () => icon.replaceWith(letter(service));
  }
  const text = element("span", { class: "text" },
    element("span", { class: "name" }, service.name),
    element("span", { class: "state" }, service.shutdown ? "shut down" : service.state));
  if (errors.has(service.service)) text.append(element("span", { class: "error" }, errors.get(service.service)));
  const link = service.href
    ? element("a", { class: "link", href: service.href }, icon, text)
    : element("span", { class: "link" }, icon, text);
  const node = element("article", { class: "card", "data-state": service.state }, link);
  if (service.switchable) {
    const toggle = element("input", { type: "checkbox", role: "switch", "aria-label": `${service.name} on` });
    toggle.checked = !service.shutdown;
    toggle.onchange = () => {
      if (!toggle.checked && !confirm(`Shut down ${service.name}? It stays off through deploys and reboots.`)) {
        toggle.checked = true;
        return;
      }
      toggle.disabled = true;
      control(service, toggle.checked ? "on" : "off");
    };
    const restart = element("button", { type: "button" }, "Restart");
    restart.disabled = service.shutdown;
    restart.onclick = () => {
      if (!confirm(`Restart ${service.name}?`)) return;
      restart.disabled = true;
      control(service, "restart");
    };
    node.append(element("span", { class: "controls" }, restart, element("label", { class: "switch" }, toggle, element("span"))));
  }
  return node;
}

let current = JSON.parse(document.getElementById("services").textContent);

function render(services) {
  current = services;
  main.replaceChildren(...sections.flatMap(section => {
    const cards = services.filter(service => service.section === section.slug).map(card);
    if (!cards.length) return [];
    const node = element("section", { style: `--accent: var(--${section.slug})` },
      element("h2", {}, section.title),
      element("div", { class: "grid" }, ...cards));
    return [node];
  }));
}

render(current);
const live = document.getElementById("live");
function follow() {
  const stream = new EventSource("/events");
  stream.addEventListener("services", event => render(JSON.parse(event.data)));
  stream.onopen = () => { live.className = "on"; live.textContent = "live"; };
  stream.onerror = () => {
    live.className = "";
    live.textContent = "offline";
    if (stream.readyState === EventSource.CLOSED) setTimeout(follow, 5000);
  };
}

follow();
</script>
</body>
</html>
