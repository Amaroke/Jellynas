[package]
name = "dashboard"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
minijinja = { version = "3.1", features = ["json", "serde"] }
resvg = { version = "0.50.0", default-features = false, features = ["text"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
ureq = { workspace = true, features = ["json"] }

[dev-dependencies]
tempfile.workspace = true
