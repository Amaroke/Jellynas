[package]
name = "dashboard"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
minijinja = { version = "3.1", features = ["json", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
ureq = { version = "3.0", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
