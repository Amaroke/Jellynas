[package]
name = "dashboard"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
jiff = { version = "1.0", features = ["tzdb-bundle-always"] }
minijinja = { version = "3.1", features = ["json", "serde"] }
resvg = { version = "0.50.0", default-features = false, features = ["text"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "__rustls-tls"] }
ureq = { version = "3.0", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
