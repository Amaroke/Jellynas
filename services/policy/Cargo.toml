[package]
name = "policy"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jiff = { version = "1.0", features = ["tzdb-bundle-always"] }
serde_json = "1.0"
ureq = { version = "3.0", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
