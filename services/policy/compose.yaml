---
services:
  policy:
    build: .
    container_name: policy
    restart: unless-stopped
    networks:
      - internal-zone
      - identity-zone
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: ${PUID}:${PGID}
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    mem_limit: 16m
    environment:
      TZ: ${TZ}
      DOMAIN: ${DOMAIN}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
      KAVITA_API_KEY: ${KAVITA_API_KEY:-}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
      AURRAL_API_KEY: ${AURRAL_API_KEY}
      LAZYLIBRARIAN_API_KEY: ${LAZYLIBRARIAN_API_KEY:-}
      LLDAP_POLICY_PASSWORD: ${LLDAP_POLICY_PASSWORD:-}
    volumes:
      - ${DATA_ROOT}/media/private:/data/media/private
    labels:
      kuma.policy.docker.name: Policy
      dashboard.name: Policy
      dashboard.section: Hosting
      dashboard.icon: rust.svg
      dashboard.icon-dark: rust-light.svg
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    healthcheck:
      test:
        - "CMD"
        - "/policy"
        - "health"
      timeout: 10s
      start_period: 60s
