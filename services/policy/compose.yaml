---
services:
  policy:
    build: .
    container_name: policy
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: ${PUID}:${PGID}
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    mem_limit: 16m
    environment:
      TZ: ${TZ}
      DOMAIN: ${DOMAIN}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
      AURRAL_API_KEY: ${AURRAL_API_KEY}
      LAZYLIBRARIAN_API_KEY: ${LAZYLIBRARIAN_API_KEY:-}
      SUWAYOMI_USERNAME: ${SUWAYOMI_USERNAME:-}
      SUWAYOMI_PASSWORD: ${SUWAYOMI_PASSWORD:-}
    labels:
      kuma.policy.docker.name: Policy
      dashboard.name: Policy
      dashboard.section: Automation
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    healthcheck:
      test:
        - "CMD"
        - "/policy"
        - "health"
      timeout: 10s
      start_period: 60s
