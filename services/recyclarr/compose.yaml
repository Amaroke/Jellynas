---
services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:9.0.0
    container_name: recyclarr
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
    labels:
      kuma.recyclarr.docker.name: Recyclarr
      dashboard.name: Recyclarr
      dashboard.section: Automation
      dashboard.description: Quality profiles, synced every night
      dashboard.icon: recyclarr.svg
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    volumes:
      - ./recyclarr.yml:/config/recyclarr.yml:ro
      - ./settings.yml:/config/settings.yml:ro
      - ./custom-formats:/config/custom-formats:ro
      - ${APPDATA_ROOT}/recyclarr:/config
