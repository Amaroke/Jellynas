---
services:
  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:6.13.9
    container_name: cross-seed
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: ${PUID}:${PGID}
    command: daemon
    environment:
      TZ: ${TZ}
      CROSS_SEED_API_KEY: ${CROSS_SEED_API_KEY}
      CROSS_SEED_INDEXER_IDS: ${CROSS_SEED_INDEXER_IDS}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
      QBITTORRENT_USER: ${QBITTORRENT_USER}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
    labels:
      kuma.cross-seed.http.name: cross-seed
      kuma.cross-seed.http.url: http://cross-seed:2468/api/ping
      docker-volume-backup.stop-during-backup: "true"
    volumes:
      - ${APPDATA_ROOT}/cross-seed:/config
      - ./config.js:/config/config.js:ro
      - ${DATA_ROOT}/torrents:/data/torrents
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "--output"
        - "/dev/null"
        - "http://localhost:2468/api/ping"
      timeout: 10s
      start_period: 30s
