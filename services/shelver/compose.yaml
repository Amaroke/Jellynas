---
services:
  shelver:
    image: python:3.15.2-slim-trixie
    container_name: shelver
    restart: unless-stopped
    command: ["python", "-u", "/app/scripts/shelver.py", "--every", "900"]
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: ${PUID}:${PGID}
    mem_limit: 128m
    environment:
      TZ: ${TZ}
    labels:
      kuma.shelver.docker.name: Shelver
      dashboard.name: Shelver
      dashboard.section: Automation
      dashboard.description:
        Writes the series inside new books and files new manga volumes
      dashboard.icon: kavita.svg
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    volumes:
      - ../../scripts:/app/scripts:ro
      - ${DATA_ROOT}/media/books:/data/media/books
      - ${DATA_ROOT}/media/manga:/data/media/manga
