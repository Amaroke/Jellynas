---
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.12
    container_name: uptime-kuma
    restart: unless-stopped
    depends_on:
      - uptime-kuma-socket-proxy
    networks:
      - internal-zone
      - uptime-kuma-docker-zone
    security_opt:
      - no-new-privileges
    environment:
      TZ: ${TZ}
    labels:
      docker-volume-backup.stop-during-backup: "true"
      dashboard.name: Uptime Kuma
      dashboard.section: Observation
      dashboard.description: Checks of every service
      dashboard.widget: uptime-kuma
      dashboard.icon: uptime-kuma.svg
      dashboard.href: https://uptime-kuma.lan.${DOMAIN}:${CADDY_HTTPS_PORT:-443}
    volumes:
      - ${APPDATA_ROOT}/uptime-kuma:/app/data

  autokuma:
    image: ghcr.io/bigboot/autokuma:2.0.0
    container_name: autokuma
    restart: unless-stopped
    networks:
      - internal-zone
      - autokuma-docker-zone
    security_opt:
      - no-new-privileges
    depends_on:
      - uptime-kuma
      - socket-proxy
    environment:
      AUTOKUMA__KUMA__URL: http://uptime-kuma:3001
      AUTOKUMA__KUMA__USERNAME: ${UPTIME_KUMA_USERNAME}
      AUTOKUMA__KUMA__PASSWORD: ${UPTIME_KUMA_PASSWORD}
      AUTOKUMA__DOCKER__HOSTS: tcp://socket-proxy:2375
      AUTOKUMA__ON_DELETE: keep
      AUTOKUMA__DEFAULT_SETTINGS: |-
        http.interval: 60
        http.max_retries: 2
        http.notification_name_list: ["discord"]
        docker.interval: 60
        docker.max_retries: 2
        docker.docker_container: {{container_name}}
        docker.docker_host_name: nas
        docker.notification_name_list: ["discord"]
    labels:
      kuma.nas.docker_host.name: NAS
      kuma.nas.docker_host.connection_type: tcp
      kuma.nas.docker_host.path: http://uptime-kuma-socket-proxy:2375
      kuma.discord.notification.name: discord
      kuma.discord.notification.active: "true"
      kuma.discord.notification.config: >-
        {"type": "discord",
        "discordWebhookUrl":
        "https://discord.com/api/webhooks/${DISCORD_ALERTS_WEBHOOK_ID}/${DISCORD_ALERTS_WEBHOOK_TOKEN}",
        "discordUsername": "Uptime Kuma", "applyExisting": false}
      kuma.autokuma.docker.name: AutoKuma
      dashboard.name: AutoKuma
      dashboard.section: Observation
      dashboard.icon: uptime-kuma.svg
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    volumes:
      - ${APPDATA_ROOT}/autokuma:/data

  uptime-kuma-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.9-r0-ls108
    container_name: uptime-kuma-socket-proxy
    restart: unless-stopped
    networks:
      - uptime-kuma-docker-zone
    security_opt:
      - no-new-privileges
    read_only: true
    tmpfs:
      - /run
    environment:
      CONTAINERS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      ALLOW_INSPECT: "1"
      POST: "0"
    labels:
      kuma.uptime-kuma-socket-proxy.docker.name: Uptime Kuma socket proxy
      dashboard.name: Uptime Kuma socket proxy
      dashboard.section: Observation
      dashboard.icon: docker.svg
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../socket-proxy/haproxy.cfg:/templates/haproxy.cfg:ro
