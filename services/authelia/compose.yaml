services:
  authelia:
    image: authelia/authelia:4.39.28
    container_name: authelia
    restart: unless-stopped
    networks:
      - identity-zone
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      DOMAIN: ${DOMAIN}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: ${AUTHELIA_OIDC_HMAC_SECRET}
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD: ${LLDAP_AUTHELIA_PASSWORD}
    labels:
      kuma.authelia.http.name: Authelia
      kuma.authelia.http.url: https://auth.${DOMAIN}:${CADDY_HTTPS_PORT:-443}/api/health
      kuma.authelia.http.expiry_notification: "true"
      docker-volume-backup.stop-during-backup: "true"
    volumes:
      - ./configuration.yml:/config/configuration.yml:ro
      - ${APPDATA_ROOT}/authelia:/var/lib/authelia
    depends_on:
      - lldap
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9091/api/health"]
      timeout: 10s
      start_period: 30s
