---
- Actions rapides:
    - Actions:
        widget:
          type: iframe
          name: quick-actions
          src:
            https://actions.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}/actions
          classes: h-24
          referrerPolicy: same-origin

- Watch:
    - Jellyfin:
        icon: jellyfin.svg
        description: Streams the Library
        href:
          https://jellyfin.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: jellyfin
          url:
            https://jellyfin.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
          key: '{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}'
          version: 2
          enableBlocks: true
          enableNowPlaying: true
          enableMediaControl: false
          enableUser: true
          showEpisodeNumber: true
          fields: ["movies", "series", "episodes"]
    - Seerr:
        icon: seerr.svg
        description: Requests of the Friends
        href:
          https://seerr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: seerr
          url: https://seerr.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
          key: '{{HOMEPAGE_VAR_SEERR_API_KEY}}'
          fields: ["pending", "processing", "available", "issues"]
    - Aurral:
        icon: aurral.png
        description: Music discovery and playlists of the Friends
        href:
          https://aurral.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        siteMonitor:
          https://aurral.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}/api/health/live
    - Music bot:
        icon: mdi-music-circle-#ab47bc
        description: Music of the Library on Discord
        widget:
          type: customapi
          url: http://music-bot:8000/status
          refreshInterval: 15000
          mappings:
            - field: state
              label: State
            - field: track
              label: Track
            - field: queue
              label: Queue
              format: number
            - field: shuffle
              label: Shuffle

- Downloads:
    - qBittorrent:
        icon: qbittorrent.svg
        description: Torrents, through the VPN only
        href:
          https://qbittorrent.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: qbittorrent
          url: http://gluetun:8080
          key: '{{HOMEPAGE_VAR_QBITTORRENT_API_KEY}}'
          enableLeechProgress: true
          enableLeechSize: true
    - Gluetun:
        icon: gluetun.svg
        description: VPN and kill switch of qBittorrent
        widget:
          type: gluetun
          url: http://gluetun:8000
          key: '{{HOMEPAGE_VAR_GLUETUN_API_KEY}}'
          version: 2
          fields: ["public_ip", "region", "country"]
    - slskd:
        icon: slskd.svg
        description: Soulseek, through the VPN only
        href:
          https://slskd.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: slskd
          url: http://gluetun:5030
          key: '{{HOMEPAGE_VAR_SLSKD_API_KEY}}'
          fields: ["slskStatus", "downloads", "uploads", "sharedFiles"]

- Ratio:
    - autobrr:
        icon: autobrr.svg
        description: IRC announces
        href:
          https://autobrr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: autobrr
          url: http://autobrr:7474
          key: '{{HOMEPAGE_VAR_AUTOBRR_API_KEY}}'
          fields: ["approvedPushes", "rejectedPushes", "filters", "indexers"]
    - cross-seed:
        icon: cross-seed.png
        description: Seeds the same data on C411
        siteMonitor: http://cross-seed:2468/api/ping
    - Farm board:
        icon: mdi-message-image-#a78bfa
        description: Board of the Farm on Discord, hourly and on each change
    - Discord posts:
        icon: mdi-message-text-#a78bfa
        description: Republishes the Discord messages, every day at 00:30

- Graphs:
    - Farm account:
        description: Account ratio, its tiers, Zen, upload and download
        widget:
          type: iframe
          name: farm-board
          src:
            https://ratio.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}/graphs?lang=fr&part=1
          classes: h-96
          referrerPolicy: same-origin
          loadingStrategy: lazy
          refreshInterval: 600000
    - Farm quests:
        description: Quests of C411 and their switches
        widget:
          type: iframe
          name: farm-quests
          src:
            https://ratio.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}/graphs?lang=fr&part=2
          classes: h-96
          referrerPolicy: same-origin
          loadingStrategy: lazy
          refreshInterval: 600000
    - Farm settings:
        description: Switches, settings, disk and earnings of the Farm
        widget:
          type: iframe
          name: farm-settings
          src:
            https://ratio.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}/graphs?lang=fr&part=3
          classes: h-96
          referrerPolicy: same-origin
          loadingStrategy: lazy
          refreshInterval: 600000

- Automation:
    - Prowlarr:
        icon: prowlarr.svg
        description: Indexers
        href:
          https://prowlarr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: '{{HOMEPAGE_VAR_PROWLARR_API_KEY}}'
          fields:
            - numberOfGrabs
            - numberOfQueries
            - numberOfFailGrabs
            - numberOfFailQueries
    - Radarr:
        icon: radarr.svg
        description: Movies
        href:
          https://radarr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: radarr
          url: http://radarr:7878
          key: '{{HOMEPAGE_VAR_RADARR_API_KEY}}'
          enableQueue: true
          fields: ["movies", "wanted", "missing", "queued"]
    - Sonarr:
        icon: sonarr.svg
        description: Shows and anime
        href:
          https://sonarr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: '{{HOMEPAGE_VAR_SONARR_API_KEY}}'
          enableQueue: true
          fields: ["series", "wanted", "queued"]
    - Lidarr:
        icon: lidarr.svg
        description: Music
        href:
          https://lidarr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: lidarr
          url: http://lidarr:8686
          key: '{{HOMEPAGE_VAR_LIDARR_API_KEY}}'
          fields: ["artists", "wanted", "queued"]
    - LazyLibrarian:
        icon: lazylibrarian.png
        description: Books
        href:
          https://lazylibrarian.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
    - Suwayomi:
        icon: suwayomi.svg
        description: Manga, through the VPN only
        href:
          https://suwayomi.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: suwayomi
          url: http://gluetun:4567
          username: '{{HOMEPAGE_VAR_SUWAYOMI_USERNAME}}'
          password: '{{HOMEPAGE_VAR_SUWAYOMI_PASSWORD}}'
          fields: ["download", "nondownload", "read", "unread"]
    - Bazarr:
        icon: bazarr.svg
        description: Subtitles
        href:
          https://bazarr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: '{{HOMEPAGE_VAR_BAZARR_API_KEY}}'
    - Tdarr:
        icon: tdarr.svg
        description: MKV H265 1080p
        href:
          https://tdarr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: tdarr
          url: http://tdarr:8265
          key: '{{HOMEPAGE_VAR_TDARR_API_KEY}}'
          fields: ["queue", "processed", "errored", "saved"]
    - Recyclarr:
        icon: recyclarr.svg
        description: Quality profiles, synced every night
    - FlareSolverr:
        icon: flaresolverr.svg
        description: Cloudflare for Prowlarr
        siteMonitor: http://flaresolverr:8191/health

- Observation:
    - Beszel:
        icon: beszel.svg
        description: Resources of the Host and the containers
        href:
          https://beszel.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: beszel
          url: http://beszel:8090
          username: '{{HOMEPAGE_VAR_BESZEL_EMAIL}}'
          password: '{{HOMEPAGE_VAR_BESZEL_PASSWORD}}'
          version: 2
          systemId: NAS
          fields: ["status", "cpu", "memory", "network"]
    - Uptime Kuma:
        icon: uptime-kuma.svg
        description: Checks of every service
        href:
          https://uptime-kuma.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          slug: nas
          fields: ["up", "down", "uptime", "incident"]
    - Dozzle:
        icon: dozzle.svg
        description: Logs of every container
        href:
          https://dozzle.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        siteMonitor: http://dozzle:8080/healthcheck
    - Backup:
        icon: mdi-archive-arrow-down-#00897b
        description: Archive of the appdata, every night
    - Indexarr:
        icon: mdi-file-table-box-multiple-#00897b
        description: Catalog of the Library files, read-only
        href:
          https://indexarr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        siteMonitor: http://indexarr:8787/health

- Hosting:
    - TrueNAS:
        icon: truenas-scale.svg
        description: Host, pool and datasets
        href:
          https://truenas.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
    - Caddy:
        icon: caddy.svg
        description: HTTPS proxy, the only published port
    - Authelia:
        icon: authelia.svg
        description: Sign-in of Aurral with the Account
        siteMonitor:
          https://auth.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}/api/health
    - lldap:
        icon: lldap.svg
        description: Accounts of the Friends and the Admin
        href:
          https://lldap.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
