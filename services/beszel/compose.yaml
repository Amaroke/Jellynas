---
services:
  beszel:
    image: henrygd/beszel:0.21.1
    container_name: beszel
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    environment:
      USER_EMAIL: ${BESZEL_EMAIL}
      USER_PASSWORD: ${BESZEL_PASSWORD}
      CONTAINER_DETAILS: "false"
    labels:
      kuma.beszel.http.name: Beszel
      kuma.beszel.http.url: http://beszel:8090/api/health
      docker-volume-backup.stop-during-backup: "true"
    volumes:
      - ${APPDATA_ROOT}/beszel:/beszel_data
      - beszel_socket:/beszel_socket
    configs:
      - source: beszel-systems
        target: /beszel_data/config.yml
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 60s
      timeout: 10s
      start_period: 30s

  beszel-agent:
    image: henrygd/beszel-agent:0.21.1
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    depends_on:
      - socket-proxy
    security_opt:
      - no-new-privileges
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_AGENT_KEY}
      DOCKER_IMAGE_CHECK: "false"
      DOCKER_HOST: tcp://127.0.0.1:2375
    labels:
      kuma.beszel-agent.docker.name: Beszel agent
    volumes:
      - beszel_socket:/beszel_socket
      - ${DATA_ROOT}/.beszel:/extra-filesystems/data__Data:ro
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 10s
      start_period: 30s

volumes:
  beszel_socket:

configs:
  beszel-systems:
    content: |
      systems:
        - name: NAS
          host: /beszel_socket/beszel.sock
