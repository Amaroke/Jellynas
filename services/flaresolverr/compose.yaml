services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    environment:
      TZ: ${TZ}
    labels:
      kuma.flaresolverr.http.name: FlareSolverr
      kuma.flaresolverr.http.url: http://flaresolverr:8191/health
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8191/health"]
      timeout: 10s
      start_period: 30s
