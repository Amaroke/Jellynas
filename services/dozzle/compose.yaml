---
services:
  dozzle:
    image: amir20/dozzle:v11.5.0
    container_name: dozzle
    restart: unless-stopped
    networks:
      - internal-zone
      - dozzle-docker-zone
    depends_on:
      - dozzle-socket-proxy
    security_opt:
      - no-new-privileges
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_NO_ANALYTICS: "true"
      DOCKER_HOST: tcp://dozzle-socket-proxy:2375
    labels:
      kuma.dozzle.http.name: Dozzle
      kuma.dozzle.http.url: http://dozzle:8080/healthcheck
      dashboard.name: Dozzle
      dashboard.section: Observation
      dashboard.description: Logs of every container
      dashboard.monitor: http://dozzle:8080/healthcheck
      dashboard.icon: dozzle.svg
      dashboard.href: https://dozzle.lan.${DOMAIN}:${CADDY_HTTPS_PORT:-443}
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    volumes:
      - ${APPDATA_ROOT}/dozzle:/data
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      timeout: 10s
      start_period: 30s

  dozzle-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.9-r0-ls108
    container_name: dozzle-socket-proxy
    restart: unless-stopped
    networks:
      - dozzle-docker-zone
    security_opt:
      - no-new-privileges
    read_only: true
    tmpfs:
      - /run
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      ALLOW_INSPECT: "1"
      ALLOW_LOGS: "1"
      POST: "0"
    labels:
      kuma.dozzle-socket-proxy.docker.name: Dozzle socket proxy
      dashboard.name: Dozzle socket proxy
      dashboard.section: Observation
      dashboard.icon: docker.svg
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../socket-proxy/haproxy.cfg:/templates/haproxy.cfg:ro
