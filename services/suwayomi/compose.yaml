---
services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2373-stable
    container_name: suwayomi
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: ${PUID}:${PGID}
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_started
        restart: true
    environment:
      TZ: ${TZ}
      AUTH_MODE: basic_auth
      AUTH_USERNAME: ${SUWAYOMI_USERNAME}
      AUTH_PASSWORD: ${SUWAYOMI_PASSWORD}
      DOWNLOAD_AS_CBZ: "true"
    labels:
      kuma.suwayomi.docker.name: Suwayomi
      docker-volume-backup.stop-during-backup: "true"
      dashboard.name: Suwayomi
      dashboard.section: Automation
      dashboard.description: Manga, through the VPN only
      dashboard.widget: suwayomi
      dashboard.icon: suwayomi.svg
      dashboard.href: https://suwayomi.lan.${DOMAIN}:${CADDY_HTTPS_PORT:-443}
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    volumes:
      - ${DATA_ROOT}/media/manga:/home/suwayomi/.local/share/Tachidesk/downloads
      - ${APPDATA_ROOT}/suwayomi:/home/suwayomi/.local/share/Tachidesk
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--silent"
        - "--output"
        - "/dev/null"
        - "http://localhost:4567/"
      timeout: 10s
      start_period: 60s
