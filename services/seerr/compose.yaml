---
services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.2
    container_name: seerr
    init: true
    restart: unless-stopped
    networks:
      - seerr-zone
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    labels:
      kuma.seerr.http.name: Seerr
      kuma.seerr.http.url:
        https://seerr.${DOMAIN}:${CADDY_HTTPS_PORT:-443}/api/v1/settings/public
      kuma.seerr.http.expiry_notification: "true"
      docker-volume-backup.stop-during-backup: "true"
      dashboard.name: Seerr
      dashboard.section: Watch
      dashboard.description: Requests of the Friends
      dashboard.widget: seerr
      dashboard.icon: seerr.svg
      dashboard.href: https://seerr.lan.${DOMAIN}:${CADDY_HTTPS_PORT:-443}
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    volumes:
      - ${APPDATA_ROOT}/seerr:/app/config
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--quiet"
        - "--spider"
        - "http://localhost:5055/api/v1/settings/public"
      timeout: 10s
      start_period: 30s
