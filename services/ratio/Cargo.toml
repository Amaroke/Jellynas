[package]
name = "ratio"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jiff = { version = "1.0", features = ["tzdb-bundle-always"] }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
ureq = "3.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
