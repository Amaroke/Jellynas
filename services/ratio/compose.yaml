---
services:
  ratio:
    image: ghcr.io/amaroke/jellynas-ratio:main
    container_name: ratio
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      HTTPS_PROXY: http://gluetun:8888
      QBITTORRENT_USER: ${QBITTORRENT_USER}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
      CROSS_SEED_API_KEY: ${CROSS_SEED_API_KEY}
      RATIO_TRACKER: ${RATIO_TRACKER:-}
      RATIO_HOLD_INDEXER_IDS: ${RATIO_HOLD_INDEXER_IDS:-}
      RATIO_MAX_SIZE_GB: ${RATIO_MAX_SIZE_GB:-}
      C411_PROFILE_API_KEY: ${C411_PROFILE_API_KEY:-}
      C411_TORZNAB_API_KEY: ${C411_TORZNAB_API_KEY:-}
      RATIO_FLOOR: ${RATIO_FLOOR:-}
    labels:
      kuma.ratio.docker.name: Ratio
      docker-volume-backup.stop-during-backup: "true"
      dashboard.name: Ratio
      dashboard.section: Farm
      dashboard.icon: speedtest-tracker.svg
      dashboard.icon-dark: speedtest-tracker-light.svg
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    volumes:
      - ${APPDATA_ROOT}/ratio:/state
