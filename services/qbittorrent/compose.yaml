---
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls488
    container_name: qbittorrent
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_started
        restart: true
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      kuma.qbittorrent.http.name: qBittorrent
      kuma.qbittorrent.http.url: http://gluetun:8080
      docker-volume-backup.stop-during-backup: "true"
      dashboard.name: qBittorrent
      dashboard.section: Downloads
      dashboard.description: Torrents, through the VPN only
      dashboard.widget: qbittorrent
      dashboard.icon: qbittorrent.svg
      dashboard.href: https://qbittorrent.lan.${DOMAIN}:${CADDY_HTTPS_PORT:-443}
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    volumes:
      - ${APPDATA_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}/torrents:/data/torrents
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "--output"
        - "/dev/null"
        - "http://localhost:8080"
      timeout: 10s
      start_period: 30s
