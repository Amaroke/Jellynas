---
services:
  gluetun:
    image: ghcr.io/qdm12/gluetun:v3.41.3
    container_name: gluetun
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    entrypoint: ["/bin/sh", "/jellynas-entrypoint.sh"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-}
      VPN_TYPE: ${VPN_TYPE:-}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_PRESHARED_KEY: ${WIREGUARD_PRESHARED_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      SERVER_REGIONS: ${SERVER_REGIONS:-}
      FIREWALL_VPN_INPUT_PORTS: ${VPN_FORWARDED_PORT:-}
      GLUETUN_API_KEY: ${GLUETUN_API_KEY:-}
      HTTPPROXY: "on"
      HTTPPROXY_STEALTH: "on"
    labels:
      kuma.gluetun.docker.name: Gluetun
    volumes:
      - ./entrypoint.sh:/jellynas-entrypoint.sh:ro
      - ${APPDATA_ROOT}/gluetun:/gluetun
