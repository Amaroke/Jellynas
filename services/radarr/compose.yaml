---
services:
  radarr:
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328
    container_name: radarr
    restart: unless-stopped
    depends_on:
      prowlarr:
        condition: service_healthy
        required: false
      qbittorrent:
        condition: service_healthy
        required: false
    networks:
      - seerr-zone
      - internal-zone
    security_opt:
      - no-new-privileges
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      kuma.radarr.http.name: Radarr
      kuma.radarr.http.url: http://radarr:7878/ping
      docker-volume-backup.stop-during-backup: "true"
      dashboard.name: Radarr
      dashboard.section: Automation
      dashboard.description: Movies
      dashboard.widget: radarr
      dashboard.icon: radarr.svg
      dashboard.href: https://radarr.lan.${DOMAIN}:${CADDY_HTTPS_PORT:-443}
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    volumes:
      - ${APPDATA_ROOT}/radarr:/config
      - ${DATA_ROOT}/:/data
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "--output"
        - "/dev/null"
        - "http://localhost:7878/ping"
      timeout: 10s
      start_period: 30s
