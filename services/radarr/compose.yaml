---
services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls325
    container_name: radarr
    restart: unless-stopped
    networks:
      - seerr-zone
      - internal-zone
    security_opt:
      - no-new-privileges
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      kuma.radarr.http.name: Radarr
      kuma.radarr.http.url: http://radarr:7878/ping
      docker-volume-backup.stop-during-backup: "true"
    volumes:
      - ${APPDATA_ROOT}/radarr:/config
      - ${DATA_ROOT}/media/movies:/data/media/movies
      - ${DATA_ROOT}/torrents:/data/torrents
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "--output"
        - "/dev/null"
        - "http://localhost:7878/ping"
      timeout: 10s
      start_period: 30s
