services:
  caddy:
    build: .
    container_name: caddy
    restart: unless-stopped
    networks:
      jellyfin-zone:
      identity-zone:
      seerr-zone:
        aliases:
          - jellyfin.${DOMAIN}
          - seerr.${DOMAIN}
          - auth.${DOMAIN}
          - aurral.${DOMAIN}
      aurral-zone:
        aliases:
          - jellyfin.${DOMAIN}
          - seerr.${DOMAIN}
          - auth.${DOMAIN}
          - aurral.${DOMAIN}
      internal-zone:
        aliases:
          - jellyfin.${DOMAIN}
          - seerr.${DOMAIN}
          - auth.${DOMAIN}
          - aurral.${DOMAIN}
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      DOMAIN: ${DOMAIN}
      LAN_SUBNET: ${LAN_SUBNET}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
      OVH_ENDPOINT: ${OVH_ENDPOINT:-ovh-eu}
      OVH_APPLICATION_KEY: ${OVH_APPLICATION_KEY}
      OVH_APPLICATION_SECRET: ${OVH_APPLICATION_SECRET}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY}
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      kuma.caddy.docker.name: Caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${APPDATA_ROOT}/caddy/data:/data
      - ${APPDATA_ROOT}/caddy/config:/config
    ports:
      - 0.0.0.0:${CADDY_HTTPS_PORT:-443}:${CADDY_HTTPS_PORT:-443}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      timeout: 10s
      start_period: 30s
