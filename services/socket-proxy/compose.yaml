---
services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.7-r0-ls105
    container_name: socket-proxy
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    read_only: true
    tmpfs:
      - /run
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    labels:
      kuma.socket-proxy.docker.name: Docker socket proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 127.0.0.1:2375:2375
