---
services:
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:9198d594-ls404
    container_name: lazylibrarian
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      kuma.lazylibrarian.docker.name: LazyLibrarian
      docker-volume-backup.stop-during-backup: "true"
      dashboard.name: LazyLibrarian
      dashboard.section: Automation
      dashboard.icon: lazylibrarian.png
      dashboard.href:
        https://lazylibrarian.lan.${DOMAIN}:${CADDY_HTTPS_PORT:-443}
      dashboard.switchable: "true"
    volumes:
      - ${APPDATA_ROOT}/lazylibrarian:/config
      - ${DATA_ROOT}/media/books:/data/media/books
      - ${DATA_ROOT}/torrents:/data/torrents
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--silent"
        - "--output"
        - "/dev/null"
        - "http://localhost:5299/"
      timeout: 10s
      start_period: 30s
