services:
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:6e755076-ls393
    container_name: lazylibrarian
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      kuma.lazylibrarian.docker.name: LazyLibrarian
      docker-volume-backup.stop-during-backup: "true"
    volumes:
      - ${APPDATA_ROOT}/lazylibrarian:/config
      - ${DATA_ROOT}/media/books:/data/media/books
      - ${DATA_ROOT}/torrents:/data/torrents
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://localhost:5299/"]
      timeout: 10s
      start_period: 30s
