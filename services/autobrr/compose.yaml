---
services:
  autobrr:
    image: ghcr.io/autobrr/autobrr:v1.90.0
    container_name: autobrr
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
    labels:
      kuma.autobrr.http.name: autobrr
      kuma.autobrr.http.url: http://autobrr:7474/api/healthz/liveness
      docker-volume-backup.stop-during-backup: "true"
    volumes:
      - ${APPDATA_ROOT}/autobrr:/config
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "--output"
        - "/dev/null"
        - "http://localhost:7474/api/healthz/liveness"
      timeout: 10s
      start_period: 30s
