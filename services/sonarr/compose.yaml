---
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329
    container_name: sonarr
    restart: unless-stopped
    networks:
      - seerr-zone
      - internal-zone
    security_opt:
      - no-new-privileges
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      kuma.sonarr.http.name: Sonarr
      kuma.sonarr.http.url: http://sonarr:8989/ping
      docker-volume-backup.stop-during-backup: "true"
      dashboard.name: Sonarr
      dashboard.section: Automation
      dashboard.description: Shows and anime
      dashboard.widget: sonarr
      dashboard.icon: sonarr.svg
      dashboard.href: https://sonarr.lan.${DOMAIN}:${CADDY_HTTPS_PORT:-443}
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    volumes:
      - ${APPDATA_ROOT}/sonarr:/config
      - ${DATA_ROOT}/:/data
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "--output"
        - "/dev/null"
        - "http://localhost:8989/ping"
      timeout: 10s
      start_period: 30s
