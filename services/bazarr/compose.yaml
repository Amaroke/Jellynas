---
services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls374
    container_name: bazarr
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      kuma.bazarr.http.name: Bazarr
      kuma.bazarr.http.url: http://bazarr:6767/api/system/ping
      docker-volume-backup.stop-during-backup: "true"
      dashboard.name: Bazarr
      dashboard.section: Automation
      dashboard.description: Subtitles
      dashboard.widget: bazarr
      dashboard.icon: bazarr.svg
      dashboard.href: https://bazarr.lan.${DOMAIN}:${CADDY_HTTPS_PORT:-443}
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    volumes:
      - ${APPDATA_ROOT}/bazarr:/config
      - ${DATA_ROOT}/media/movies:/data/media/movies
      - ${DATA_ROOT}/media/shows:/data/media/shows
      - ${DATA_ROOT}/media/anime:/data/media/anime
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "--output"
        - "/dev/null"
        - "http://localhost:6767/api/system/ping"
      timeout: 10s
      start_period: 30s
