---
services:
  discord-posts:
    build:
      context: ../..
      target: discord-posts
    container_name: discord-posts
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: ${PUID}:${PGID}
    mem_limit: 128m
    environment:
      TZ: ${TZ}
      APPDATA_ROOT: /state
      DOMAIN: ${DOMAIN}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
      DISCORD_LINKS_WEBHOOK_ID: ${DISCORD_LINKS_WEBHOOK_ID}
      DISCORD_LINKS_WEBHOOK_TOKEN: ${DISCORD_LINKS_WEBHOOK_TOKEN}
      DISCORD_NEWS_WEBHOOK_ID: ${DISCORD_NEWS_WEBHOOK_ID}
      DISCORD_NEWS_WEBHOOK_TOKEN: ${DISCORD_NEWS_WEBHOOK_TOKEN}
      DISCORD_TUTOS_WEBHOOK_ID: ${DISCORD_TUTOS_WEBHOOK_ID}
      DISCORD_TUTOS_WEBHOOK_TOKEN: ${DISCORD_TUTOS_WEBHOOK_TOKEN}
      DISCORD_PATCH_WEBHOOK_ID: ${DISCORD_PATCH_WEBHOOK_ID}
      DISCORD_PATCH_WEBHOOK_TOKEN: ${DISCORD_PATCH_WEBHOOK_TOKEN}
    labels:
      kuma.discord-posts.docker.name: Discord posts
      docker-volume-backup.stop-during-backup: "true"
      dashboard.name: Discord posts
      dashboard.section: Discord
      dashboard.description:
        Republishes the Discord messages, every day at 00:30
      dashboard.icon: discord.svg
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    volumes:
      - ../../discord-posts:/app/discord-posts:ro
      - ${APPDATA_ROOT}/discord-posts:/state/discord-posts
