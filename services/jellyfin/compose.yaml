---
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.4ubu2604-ls60
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - jellyfin-zone
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      kuma.jellyfin.http.name: Jellyfin
      kuma.jellyfin.http.url:
        https://jellyfin.${DOMAIN}:${CADDY_HTTPS_PORT:-443}/health
      kuma.jellyfin.http.expiry_notification: "true"
      docker-volume-backup.stop-during-backup: "true"
    volumes:
      - ${APPDATA_ROOT}/jellyfin:/config
      - ${DATA_ROOT}/media:/data/media:ro
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "--output"
        - "/dev/null"
        - "http://localhost:8096/health"
      timeout: 10s
      start_period: 60s

  jellyfin-policy:
    build: ./policy
    container_name: jellyfin-policy
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: ${PUID}:${PGID}
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 16m
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
    labels:
      kuma.jellyfin-policy.docker.name: Jellyfin policy
    healthcheck:
      test:
        - "CMD"
        - "/jellyfin-policy"
        - "health"
      timeout: 10s
      start_period: 60s
