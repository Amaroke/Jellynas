---
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.4ubu2604-ls61
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - jellyfin-zone
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      kuma.jellyfin.http.name: Jellyfin
      kuma.jellyfin.http.url:
        https://jellyfin.${DOMAIN}:${CADDY_HTTPS_PORT:-443}/health
      kuma.jellyfin.http.expiry_notification: "true"
      docker-volume-backup.stop-during-backup: "true"
      dashboard.name: Jellyfin
      dashboard.section: Watch
      dashboard.description: Streams the Library
      dashboard.widget: jellyfin
      dashboard.icon: jellyfin.svg
      dashboard.href: https://jellyfin.lan.${DOMAIN}:${CADDY_HTTPS_PORT:-443}
      dashboard.switchable: "true"
      cd.doco.deployment.autostart: "false"
    volumes:
      - ${APPDATA_ROOT}/jellyfin:/config
      - ${DATA_ROOT}/media:/data/media:ro
    configs:
      - source: jellyfin-web
        target: /usr/share/jellyfin/web/config.json
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "--output"
        - "/dev/null"
        - "http://localhost:8096/health"
      timeout: 10s
      start_period: 60s

configs:
  jellyfin-web:
    content: |
      {
        "includeCorsCredentials": false,
        "multiserver": false,
        "themes": [
          { "name": "Apple TV", "id": "appletv", "color": "#bcbcbc" },
          { "name": "Blue Radiance", "id": "blueradiance", "color": "#011432" },
          { "name": "Dark", "id": "dark", "color": "#202020", "default": true },
          { "name": "Light", "id": "light", "color": "#303030" },
          { "name": "Purple Haze", "id": "purplehaze", "color": "#000420" },
          { "name": "WMC", "id": "wmc", "color": "#0c2450" }
        ],
        "menuLinks": [
          {
            "name": "Livres",
            "icon": "menu_book",
            "url": "https://kavita.${DOMAIN}:${CADDY_HTTPS_PORT:-443}"
          },
          {
            "name": "Musiques",
            "icon": "library_music",
            "url": "https://aurral.${DOMAIN}:${CADDY_HTTPS_PORT:-443}"
          },
          {
            "name": "Faire une requête",
            "icon": "add",
            "url": "https://seerr.${DOMAIN}:${CADDY_HTTPS_PORT:-443}"
          }
        ],
        "servers": [],
        "plugins": [
          "playAccessValidation/plugin",
          "experimentalWarnings/plugin",
          "htmlAudioPlayer/plugin",
          "htmlVideoPlayer/plugin",
          "photoPlayer/plugin",
          "comicsPlayer/plugin",
          "bookPlayer/plugin",
          "youtubePlayer/plugin",
          "backdropScreensaver/plugin",
          "pdfPlayer/plugin",
          "logoScreensaver/plugin",
          "sessionPlayer/plugin",
          "chromecastPlayer/plugin",
          "stillWatching/plugin",
          "syncPlay/plugin"
        ]
      }
