services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls166
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${APPDATA_ROOT}/prowlarr:/config
    ports:
      - ${PROWLARR_PORT:-9696}:9696
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
