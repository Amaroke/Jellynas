services:
  ratio:
    image: python:3.14.5-alpine3.22
    container_name: ratio
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: ${PUID}:${PGID}
    command: ["python", "-u", "/app/ratio.py"]
    environment:
      TZ: ${TZ}
      QBITTORRENT_USER: ${QBITTORRENT_USER}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      CROSS_SEED_API_KEY: ${CROSS_SEED_API_KEY}
      RATIO_TRACKER: ${RATIO_TRACKER:-}
      RATIO_GRAB_INDEXER_IDS: ${RATIO_GRAB_INDEXER_IDS:-}
      RATIO_TWIN_INDEXER_IDS: ${RATIO_TWIN_INDEXER_IDS:-}
      RATIO_MAX_SIZE_GB: ${RATIO_MAX_SIZE_GB:-}
      RATIO_MIN_SEEDING_DAYS: ${RATIO_MIN_SEEDING_DAYS}
      C411_PROFILE_API_KEY: ${C411_PROFILE_API_KEY:-}
      RATIO_FLOOR: ${RATIO_FLOOR:-}
      RATIO_VOLUME_DAILY_GB: ${RATIO_VOLUME_DAILY_GB:-}
    labels:
      kuma.ratio.docker.name: ratio
      docker-volume-backup.stop-during-backup: "true"
    volumes:
      - ./ratio.py:/app/ratio.py:ro
      - ${APPDATA_ROOT}/ratio:/state
