---
name: CI

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose

  compose:
    name: Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f services/doco-cd/compose.yaml config --quiet
          docker compose -f services/check/compose.yaml --env-file .env \
            config --quiet

  images:
    name: Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:v2.15.1
          hadolint Dockerfile services/*/Dockerfile
      - id: cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          {
            echo 'to<<EOF'
            echo 'caddy.cache-to=type=gha,mode=max,scope=caddy'
            echo 'dashboard.cache-to=type=gha,mode=max,scope=rust'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      # yamllint disable-line rule:line-length
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e  # v7
        with:
          source: .
          set: |
            *.cache-from=type=gha,scope=rust
            caddy.cache-from=type=gha,scope=caddy
            caddy.output=type=docker
            ${{ steps.cache.outputs.to }}
      - run: |
          docker run --rm \
            -v "$PWD/services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=example.com \
            -e LAN_SUBNET=192.168.1.0/24 \
            -e CADDY_HTTPS_PORT=443 \
            -e OVH_ENDPOINT=ovh-eu \
            -e OVH_APPLICATION_KEY=ci \
            -e OVH_APPLICATION_SECRET=ci \
            -e OVH_CONSUMER_KEY=ci \
            ghcr.io/amaroke/jellynas-caddy:main \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  publish:
    name: Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - images
      - rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write  # push the images to GHCR
    env:
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      # yamllint disable-line rule:line-length
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e  # v7
        with:
          source: .
          provenance: false
          sbom: false
          set: |
            *.output=type=registry,rewrite-timestamp=true
            *.cache-from=type=gha,scope=rust
            caddy.cache-from=type=gha,scope=caddy

  json:
    name: JSON
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: git ls-files -z '*.json' | xargs -0 jq empty

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: pipx run yamllint==1.38.0 --strict .

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh services/gluetun/entrypoint.sh
      - run: pipx run ruff==0.17.6 check .

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: |
          version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          ! grep '^FROM rust:' Dockerfile | grep -v "^FROM rust:$version-"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          save-if: >-
            ${{ github.event_name == 'push'
            && github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: >-
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: >-
          npx --yes --package renovate@45.4.0 --
          renovate-config-validator --strict renovate.json

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: npx --yes markdownlint-cli2@0.24.2 "**/*.md"

  actions:
    name: Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
          -color
      - run: >-
          pipx run zizmor==1.33.1 --persona=pedantic --min-severity=low
          .github/workflows
