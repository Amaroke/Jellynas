---
name: CI

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose

  compose:
    name: Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f services/doco-cd/compose.yaml config --quiet

  images:
    name: Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:v2.15.1
          hadolint services/*/Dockerfile
      - run: |
          cp .env.example .env
          docker compose build
      - run: |
          docker run --rm \
            -v "$PWD/services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=example.com \
            -e LAN_SUBNET=192.168.1.0/24 \
            -e CADDY_HTTPS_PORT=443 \
            -e OVH_ENDPOINT=ovh-eu \
            -e OVH_APPLICATION_KEY=ci \
            -e OVH_APPLICATION_SECRET=ci \
            -e OVH_CONSUMER_KEY=ci \
            jellynas-caddy \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  json:
    name: JSON
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: git ls-files -z '*.json' | xargs -0 jq empty

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: pipx run yamllint==1.38.0 --strict .

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh services/gluetun/entrypoint.sh
      - run: pipx run ruff==0.17.4 check .

  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: >-
          npx --yes --package renovate@44.222.4 --
          renovate-config-validator --strict renovate.json

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: npx --yes markdownlint-cli2@0.24.0 "**/*.md"

  actions:
    name: Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
          -color
      - run: >-
          pipx run zizmor==1.32.0 --persona=pedantic --min-severity=low
          .github/workflows
