---
name: Publish

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write  # push the images to GHCR
    env:
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      # yamllint disable-line rule:line-length
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e  # v7
        with:
          source: .
          provenance: false
          sbom: false
          set: |
            *.output=type=registry,rewrite-timestamp=true
            *.cache-from=type=gha,scope=rust
            caddy.cache-from=type=gha,scope=caddy
