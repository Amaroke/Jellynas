name: Renovate

on:
  push:
    branches-ignore:
      - main
    paths:
      - renovate.json
      - .github/workflows/renovate.yml
  pull_request:
    branches:
      - main
    paths:
      - renovate.json
      - .github/workflows/renovate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes --package renovate@44.216.5 -- renovate-config-validator --strict renovate.json
