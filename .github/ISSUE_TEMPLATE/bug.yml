name: Bug
description: A service does not start or does not behave as expected
labels:
  - bug
  - needs-triage
body:
  - type: input
    id: service
    attributes:
      label: Service
      placeholder: Jellyfin, Sonarr, Caddy...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove every password, key, domain or IP address before pasting
      render: text
  - type: input
    id: environment
    attributes:
      label: Machine
      placeholder: Windows 11 + Docker Desktop, Debian 13...
