services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2366-stable
    container_name: suwayomi
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      AUTH_MODE: basic_auth
      AUTH_USERNAME: ${SUWAYOMI_USERNAME}
      AUTH_PASSWORD: ${SUWAYOMI_PASSWORD}
      DOWNLOAD_AS_CBZ: "true"
      FLARESOLVERR_ENABLED: "true"
      FLARESOLVERR_URL: http://flaresolverr:8191
    volumes:
      - ${DATA_ROOT}/media/manga:/home/suwayomi/.local/share/Tachidesk/downloads
      - ${APPDATA_ROOT}/suwayomi:/home/suwayomi/.local/share/Tachidesk
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://localhost:4567/"]
      timeout: 10s
      start_period: 60s
