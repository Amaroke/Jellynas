- Watch:
    - Jellyfin:
        icon: jellyfin.svg
        description: Streams the Library
        href: https://jellyfin.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: '{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}'
          version: 2
          enableBlocks: true
          enableNowPlaying: true
          enableMediaControl: false
          enableUser: true
          showEpisodeNumber: true
          fields: ["movies", "series", "episodes"]
    - Seerr:
        icon: seerr.svg
        description: Requests of the Friends
        href: https://seerr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: seerr
          url: http://seerr:5055
          key: '{{HOMEPAGE_VAR_SEERR_API_KEY}}'
          fields: ["pending", "processing", "available", "issues"]

- Downloads:
    - qBittorrent:
        icon: qbittorrent.svg
        description: Torrents, through the VPN only
        href: https://qbittorrent.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: qbittorrent
          url: http://gluetun:8080
          key: '{{HOMEPAGE_VAR_QBITTORRENT_API_KEY}}'
          enableLeechProgress: true
          enableLeechSize: true
    - Gluetun:
        icon: gluetun.svg
        description: VPN and kill switch of qBittorrent
        widget:
          type: gluetun
          url: http://gluetun:8000
          key: '{{HOMEPAGE_VAR_GLUETUN_API_KEY}}'
          version: 2
          fields: ["public_ip", "region", "country"]
    - slskd:
        icon: slskd.svg
        description: Soulseek, through the VPN only
        href: https://slskd.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: slskd
          url: http://gluetun:5030
          key: '{{HOMEPAGE_VAR_SLSKD_API_KEY}}'
          fields: ["slskStatus", "downloads", "uploads", "sharedFiles"]

- Ratio:
    - Ratio:
        icon: mdi-scale-balance-#a78bfa
        description: Ledger of C411, every torrent ever seeded
        widget:
          type: customapi
          url: http://ratio:8000/summary
          refreshInterval: 60000
          mappings:
            - field: ledger.ratio
              label: Ratio
              format: float
            - field: ledger.surplus_gb
              label: Surplus
              format: float
              suffix: " GB"
            - field: ledger.week_uploaded_gb
              label: Up, 7 days
              format: float
              suffix: " GB"
            - field: grabs.paused
              label: Paid grabs
              remap:
                - value: true
                  to: Paused
                - any: true
                  to: Open
    - Farm:
        icon: mdi-sprout-#34d399
        description: Torrents seeded only for upload
        widget:
          type: customapi
          url: http://ratio:8000/summary
          refreshInterval: 60000
          mappings:
            - field: farm.torrents
              label: Torrents
              format: number
            - field: farm.downloading
              label: Downloading
              format: number
            - field: farm.size_gb
              label: Size
              format: float
              suffix: " GB"
            - field: farm.fill
              label: Full
              format: percent
    - Zen reserve:
        icon: mdi-meditation-#38bdf8
        description: Rare torrents kept for their Zen
        widget:
          type: customapi
          url: http://ratio:8000/summary
          refreshInterval: 60000
          mappings:
            - field: zen.torrents
              label: Torrents
              format: number
            - field: zen.size_gb
              label: Size
              format: float
              suffix: " GB"
            - field: zen.fill
              label: Full
              format: percent
            - field: grabs.today
              label: Paid today
              format: number
    - Sources:
        icon: mdi-chart-donut-#f472b6
        description: Upload / download of each Source
        widget:
          type: customapi
          url: http://ratio:8000/summary
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: sources
            name: name
            label: figures
    - autobrr:
        icon: autobrr.svg
        description: IRC announces
        href: https://autobrr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: autobrr
          url: http://autobrr:7474
          key: '{{HOMEPAGE_VAR_AUTOBRR_API_KEY}}'
          fields: ["approvedPushes", "rejectedPushes", "filters", "indexers"]
    - cross-seed:
        icon: cross-seed.png
        description: Seeds the same data on C411
        siteMonitor: http://cross-seed:2468/api/ping
    - qbit_manage:
        icon: qbitmanage.png
        description: Tags torrents by tracker
        href: https://qbit-manage.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}

- Automation:
    - Prowlarr:
        icon: prowlarr.svg
        description: Indexers
        href: https://prowlarr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: '{{HOMEPAGE_VAR_PROWLARR_API_KEY}}'
          fields: ["numberOfGrabs", "numberOfQueries", "numberOfFailGrabs", "numberOfFailQueries"]
    - Radarr:
        icon: radarr.svg
        description: Movies
        href: https://radarr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: radarr
          url: http://radarr:7878
          key: '{{HOMEPAGE_VAR_RADARR_API_KEY}}'
          enableQueue: true
          fields: ["movies", "wanted", "missing", "queued"]
    - Sonarr:
        icon: sonarr.svg
        description: Shows and anime
        href: https://sonarr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: '{{HOMEPAGE_VAR_SONARR_API_KEY}}'
          enableQueue: true
          fields: ["series", "wanted", "queued"]
    - Lidarr:
        icon: lidarr.svg
        description: Music
        href: https://lidarr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: lidarr
          url: http://lidarr:8686
          key: '{{HOMEPAGE_VAR_LIDARR_API_KEY}}'
          fields: ["artists", "wanted", "queued"]
    - LazyLibrarian:
        icon: lazylibrarian.svg
        description: Books
        href: https://lazylibrarian.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
    - Suwayomi:
        icon: suwayomi.svg
        description: Manga
        href: https://suwayomi.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: suwayomi
          url: http://suwayomi:4567
          username: '{{HOMEPAGE_VAR_SUWAYOMI_USERNAME}}'
          password: '{{HOMEPAGE_VAR_SUWAYOMI_PASSWORD}}'
          fields: ["download", "nondownload", "read", "unread"]
    - Bazarr:
        icon: bazarr.svg
        description: Subtitles
        href: https://bazarr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: '{{HOMEPAGE_VAR_BAZARR_API_KEY}}'
    - Tdarr:
        icon: tdarr.svg
        description: MKV H265 1080p
        href: https://tdarr.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: tdarr
          url: http://tdarr:8265
          key: '{{HOMEPAGE_VAR_TDARR_API_KEY}}'
          fields: ["queue", "processed", "errored", "saved"]
    - Recyclarr:
        icon: recyclarr.svg
        description: Quality profiles, synced every night
    - FlareSolverr:
        icon: flaresolverr.svg
        description: Cloudflare for Prowlarr
        siteMonitor: http://flaresolverr:8191/health

- Observation:
    - Beszel:
        icon: beszel.svg
        description: Resources of the Host and the containers
        href: https://beszel.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: beszel
          url: http://beszel:8090
          username: '{{HOMEPAGE_VAR_BESZEL_EMAIL}}'
          password: '{{HOMEPAGE_VAR_BESZEL_PASSWORD}}'
          version: 2
          systemId: NAS
          fields: ["status", "cpu", "memory", "network"]
    - Uptime Kuma:
        icon: uptime-kuma.svg
        description: Checks of every service
        href: https://uptime-kuma.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          slug: nas
          fields: ["up", "down", "uptime", "incident"]
    - Dozzle:
        icon: dozzle.svg
        description: Logs of every container
        href: https://dozzle.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
        siteMonitor: http://dozzle:8080/healthcheck

- Hosting:
    - TrueNAS:
        icon: truenas-scale.svg
        description: Host, pool and datasets
        href: https://truenas.lan.{{HOMEPAGE_VAR_DOMAIN}}:{{HOMEPAGE_VAR_HTTPS_PORT}}
    - Caddy:
        icon: caddy.svg
        description: HTTPS proxy, the only published port
