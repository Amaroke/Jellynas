services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0
    container_name: homepage
    restart: unless-stopped
    networks:
      - internal-zone
    security_opt:
      - no-new-privileges
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      LOG_TARGETS: stdout
      HOMEPAGE_ALLOWED_HOSTS: homepage.lan.${DOMAIN}:${CADDY_HTTPS_PORT:-443},homepage.lan.${DOMAIN},homepage:3000
      HOMEPAGE_EXTERNAL_URL: https://homepage.lan.${DOMAIN}:${CADDY_HTTPS_PORT:-443}
      HOMEPAGE_AUTH_ENABLED: "true"
      HOMEPAGE_AUTH_PASSWORD: ${HOMEPAGE_PASSWORD}
      HOMEPAGE_AUTH_SECRET: ${HOMEPAGE_AUTH_SECRET}
      HOMEPAGE_VAR_DOMAIN: ${DOMAIN}
      HOMEPAGE_VAR_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
      HOMEPAGE_VAR_JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
      HOMEPAGE_VAR_SEERR_API_KEY: ${SEERR_API_KEY}
      HOMEPAGE_VAR_QBITTORRENT_API_KEY: ${QBITTORRENT_API_KEY}
      HOMEPAGE_VAR_GLUETUN_API_KEY: ${GLUETUN_API_KEY:-}
      HOMEPAGE_VAR_PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      HOMEPAGE_VAR_RADARR_API_KEY: ${RADARR_API_KEY}
      HOMEPAGE_VAR_SONARR_API_KEY: ${SONARR_API_KEY}
      HOMEPAGE_VAR_LIDARR_API_KEY: ${LIDARR_API_KEY}
      HOMEPAGE_VAR_SLSKD_API_KEY: ${SLSKD_API_KEY}
      HOMEPAGE_VAR_SUWAYOMI_USERNAME: ${SUWAYOMI_USERNAME}
      HOMEPAGE_VAR_SUWAYOMI_PASSWORD: ${SUWAYOMI_PASSWORD}
      HOMEPAGE_VAR_BAZARR_API_KEY: ${BAZARR_API_KEY}
      HOMEPAGE_VAR_TDARR_API_KEY: ${TDARR_API_KEY}
      HOMEPAGE_VAR_AUTOBRR_API_KEY: ${AUTOBRR_API_KEY:-}
      HOMEPAGE_VAR_BESZEL_EMAIL: ${BESZEL_EMAIL:-}
      HOMEPAGE_VAR_BESZEL_PASSWORD: ${BESZEL_PASSWORD:-}
    labels:
      kuma.homepage.http.name: Homepage
      kuma.homepage.http.url: http://homepage:3000/api/healthcheck
    volumes:
      - ./settings.yaml:/app/config/settings.yaml:ro
      - ./services.yaml:/app/config/services.yaml:ro
      - ./widgets.yaml:/app/config/widgets.yaml:ro
      - ./bookmarks.yaml:/app/config/bookmarks.yaml:ro
      - ./custom.css:/app/config/custom.css:ro
      - ./background.svg:/app/public/images/background.svg:ro
      - ${DATA_ROOT}/.homepage:/data-disk:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/healthcheck"]
      timeout: 10s
      start_period: 30s
