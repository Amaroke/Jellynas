services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.4ubu2604-ls58
    container_name: jellyfin
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      kuma.jellyfin.http.name: Jellyfin
      kuma.jellyfin.http.url: http://jellyfin:8096/health
      kuma.jellyfin-public.http.name: Jellyfin public
      kuma.jellyfin-public.http.url: https://jellyfin.${DOMAIN}:${CADDY_HTTPS_PORT:-443}/health
      kuma.jellyfin-public.http.expiry_notification: "true"
    volumes:
      - ${APPDATA_ROOT}/jellyfin:/config
      - ${DATA_ROOT}/media:/data/media:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8096/health"]
      timeout: 10s
      start_period: 60s
