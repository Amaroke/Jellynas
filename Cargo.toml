[workspace]
resolver = "3"
members = [
    "services/check",
    "services/dashboard",
    "services/discord-posts",
    "services/policy",
    "services/ratio",
    "services/ups",
    "tests/repo",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
jiff = "1.0"
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tiny_http = "0.12"
ureq = "3.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
